<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>История техники — Caravan Resources</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --navy:#0B1A35; --navy2:#1B3B6F; --gold:#F4A52A;
  --red:#DC2626; --redbg:#FEF2F2;
  --green:#16A34A; --greenbg:#F0FDF4;
  --yellow:#B45309; --yellowbg:#FFFBEB;
  --gray:#64748B; --light:#F1F5F9; --border:#E2E8F0;
}
* { box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--light); color:var(--navy); margin:0; min-height:100vh; }
.login { display:flex; align-items:center; justify-content:center; min-height:100vh; }
.login-box { background:#fff; border-radius:16px; padding:28px; width:300px; text-align:center; }
.login-title { font-size:17px; font-weight:800; margin-bottom:14px; }
.login-box input { width:100%; padding:12px; border:1.5px solid var(--border); border-radius:10px; font-size:15px; margin-bottom:10px; }
.login-box button, .btn { padding:10px 16px; border:none; border-radius:10px; background:var(--gold);
  color:var(--navy); font-weight:800; font-size:14px; cursor:pointer; }
.login-box button { width:100%; }
.btn-ghost { background:#fff; border:1.5px solid var(--border); color:var(--navy); font-weight:700; padding:8px 12px; border-radius:8px; cursor:pointer; font-size:13px; }
.login-err { display:none; color:var(--red); font-size:12px; }
.header { background:var(--navy); color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
.header h1 { font-size:17px; margin:0; }
.header a { color:var(--gold); font-size:13px; text-decoration:none; margin-right:14px; }
.wrap { max-width:1100px; margin:0 auto; padding:16px; }
.panel { background:#fff; border-radius:12px; padding:16px; margin-bottom:14px; }
.panel-title { font-size:14px; font-weight:800; margin-bottom:10px; }
.sub { font-size:12px; color:var(--gray); }
.ctl { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
.ctl label { font-size:11px; font-weight:700; color:var(--gray); display:block; margin-bottom:3px; }
.ctl input { padding:9px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:14px; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
.card { background:#fff; border-radius:12px; padding:14px; border-left:4px solid var(--gold); }
.card .v { font-size:24px; font-weight:800; }
.card .l { font-size:12px; color:var(--gray); margin-top:2px; }
.card.red { border-left-color:var(--red); }
.summary p { margin:0 0 8px; font-size:14px; line-height:1.5; }
.tag { display:inline-block; font-size:11px; font-weight:800; padding:1px 6px; border-radius:6px; background:var(--yellowbg); color:var(--yellow); margin-right:4px; }
table { border-collapse:collapse; width:100%; font-size:13px; }
th { text-align:left; font-size:11px; color:var(--gray); padding:6px 8px; border-bottom:1.5px solid var(--border); white-space:nowrap; }
td { padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
tr.sel td { background:var(--yellowbg); }
tr.clk { cursor:pointer; }
.scroll { overflow-x:auto; }
.bar { height:8px; background:var(--red); border-radius:4px; }
.barbg { background:var(--light); border-radius:4px; width:90px; display:inline-block; vertical-align:middle; }
.err { display:none; background:var(--red); color:#fff; padding:10px 14px; border-radius:10px; margin-bottom:12px; font-size:13px; }
.state-def { color:var(--red); font-weight:700; } .state-ok { color:var(--green); font-weight:700; }
.cm { border-bottom:1px solid var(--border); padding:6px 0; font-size:13px; }
.cm .m { color:var(--gray); font-size:11px; }
svg text { font-family:inherit; }
@media (max-width:600px){ .wrap{padding:10px} .header{padding:12px} }
</style>
</head>
<body>
<div class="login" id="loginScreen"><div class="login-box">
  <div class="login-title">История техники</div>
  <input type="password" id="pinInput" placeholder="Введите PIN-код" onkeydown="if(event.key==='Enter')checkPin()">
  <button onclick="checkPin()">Войти</button>
  <div class="login-err" id="loginErr">Неверный PIN-код</div>
</div></div>

<div id="app" style="display:none">
  <div class="header"><h1>История техники по чек-листам</h1>
    <div><a href="analytics.html">Осмотры</a><button class="btn-ghost" onclick="logout()">Выйти</button></div></div>
  <div class="wrap">
    <div class="err" id="errBox"></div>
    <div class="panel"><div class="ctl">
      <div><label>Техника (ID)</label><input id="eqInput" list="eqList" placeholder="WL_510" style="width:190px"><datalist id="eqList"></datalist></div>
      <div><label>С</label><input type="date" id="fromInput"></div>
      <div><label>По</label><input type="date" id="toInput"></div>
      <button class="btn" id="goBtn" onclick="runQuery()">Построить</button>
      <button class="btn-ghost" onclick="setPreset(30)">30 дн.</button>
      <button class="btn-ghost" onclick="setPreset(90)">90 дн.</button>
      <button class="btn-ghost" onclick="setPreset(0)">Всё (с 12.07.2026)</button>
      <button class="btn-ghost" id="xlsBtn" onclick="exportXlsx()" disabled>Excel</button>
    </div>
    <div class="sub" id="status" style="margin-top:8px">Выберите технику и период. Запрос читает архивы, может занять до минуты.</div></div>
    <div id="result"></div>
  </div>
</div>
<script>
const CFG = {
  PIN: "2508",
  SHEET_URL: "https://script.google.com/macros/s/AKfycbwhdMV20k8US2BXUz1Xk2XCXE9MEwpHpQaadTF9xEfzbU1--dHL-Zuj06K2qXW-rFtKGw/exec",
  DB_START: "2026-07-12"
};
let H = null;          // последний ответ getEquipmentHistory
let SELECTED = null;   // выбранный пункт (ключ "раздел | пункт")
let EQ_LIST = [];

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const fmtD = s => s ? s.slice(8, 10) + "." + s.slice(5, 7) + "." + s.slice(0, 4) : "—";
const fmtDS = s => s ? s.slice(8, 10) + "." + s.slice(5, 7) : "—";
const dayDiff = (a, b) => Math.round((new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 86400000);
const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return (m > 10 && m < 20) ? c : k === 1 ? a : (k > 1 && k < 5) ? b : c; };
const itemKey = (s, i) => s + " | " + i;

function checkPin() {
  if ($("pinInput").value === CFG.PIN) {
    $("loginScreen").style.display = "none"; $("app").style.display = "block"; init();
  } else { $("loginErr").style.display = "block"; $("pinInput").value = ""; $("pinInput").focus(); }
}
function logout() { $("loginScreen").style.display = "flex"; $("app").style.display = "none"; $("pinInput").value = ""; }

async function fetchWithRetry(url, timeoutMs, attempts) {
  const tries = attempts || 2; let lastErr;
  for (let i = 0; i < tries; i++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs || 20000);
    try {
      const r = await fetch(url, { cache: "no-store", signal: ctrl.signal });
      clearTimeout(timer);
      return await r.json();
    } catch (e) {
      clearTimeout(timer); lastErr = e;
      if (i < tries - 1) await new Promise(res => setTimeout(res, 1500 * (i + 1)));
    }
  }
  throw lastErr;
}

function setPreset(days) {
  const to = new Date();
  $("toInput").value = ymd(to);
  if (days > 0) { const f = new Date(); f.setDate(f.getDate() - days); $("fromInput").value = ymd(f); }
  else $("fromInput").value = CFG.DB_START;
}

async function init() {
  setPreset(0);
  const q = new URLSearchParams(location.search);
  if (q.get("eq")) $("eqInput").value = q.get("eq");
  if (q.get("from")) $("fromInput").value = q.get("from");
  if (q.get("to")) $("toInput").value = q.get("to");
  try {
    const eq = await fetchWithRetry(`${CFG.SHEET_URL}?action=getEquipment`, 40000, 3);
    if (Array.isArray(eq)) {
      EQ_LIST = eq;
      $("eqList").innerHTML = eq.map(e => {
        const id = e.equipmentId || e.id || "";
        return `<option value="${esc(id)}">${esc([e.name, e.site].filter(Boolean).join(" · "))}</option>`;
      }).join("");
    }
  } catch (e) { console.error("Справочник техники:", e); }
  if (q.get("eq")) runQuery();
}

async function runQuery() {
  const eq = $("eqInput").value.trim();
  const from = $("fromInput").value, to = $("toInput").value;
  const eb = $("errBox"); eb.style.display = "none";
  if (!eq) { eb.textContent = "Укажите технику."; eb.style.display = "block"; return; }
  if (from && to && to < from) { eb.textContent = "Конец периода раньше начала."; eb.style.display = "block"; return; }
  $("goBtn").disabled = true; $("xlsBtn").disabled = true;
  $("status").textContent = "Читаю чек-листы и архивы… до минуты.";
  try {
    const url = `${CFG.SHEET_URL}?action=getEquipmentHistory&equipmentId=${encodeURIComponent(eq)}&from=${from}&to=${to}`;
    const r = await fetchWithRetry(url, 120000, 2);
    if (!r || !r.ok) throw new Error((r && r.error) || "Сервер вернул ошибку. Если экшен новый — проверьте, что Код.gs задеплоен новой версией.");
    H = r; SELECTED = null;
    $("status").textContent = `Готово: ${r.summary.inspections} осмотров, ${fmtD(r.from)} — ${fmtD(r.to)}.`;
    render();
    $("xlsBtn").disabled = !r.summary.inspections;
  } catch (e) {
    eb.textContent = "Не удалось получить данные: " + e.message; eb.style.display = "block";
    $("status").textContent = "";
  }
  $("goBtn").disabled = false;
}

// ── Расчёты на клиенте ─────────────────────────────────────
function maxGap(days) { // самый длинный перерыв между днями осмотров
  let best = { n: 0, a: null, b: null };
  for (let i = 1; i < days.length; i++) {
    const n = dayDiff(days[i - 1].day, days[i].day) - 1;
    if (n > best.n) best = { n, a: days[i - 1].day, b: days[i].day };
  }
  return best;
}
function heatmap() { // строки — пункты с замечаниями, столбцы — недели
  const weeks = H.weekly.map(w => w.week);
  const insPerWeek = {}; H.weekly.forEach(w => insPerWeek[w.week] = w.inspections);
  const weekOf = day => { const dt = new Date(day + "T00:00:00Z"); const wd = (dt.getUTCDay() + 6) % 7; return new Date(dt - wd * 864e5).toISOString().slice(0, 10); };
  const cnt = {};
  H.inspections.forEach(x => x.defects.forEach(d => {
    const k = itemKey(d.section, d.item), w = weekOf(x.day);
    (cnt[k] = cnt[k] || {})[w] = (cnt[k][w] || 0) + 1;
  }));
  const rows = H.items.filter(i => i.defects > 0).slice(0, 15).map(i => ({ key: itemKey(i.section, i.item), item: i, cnt: cnt[itemKey(i.section, i.item)] || {} }));
  return { weeks, insPerWeek, rows };
}

// ── Графики (SVG) ──────────────────────────────────────────
function chartWeekly() {
  const w = H.weekly; if (!w.length) return "";
  const W = 1000, Hh = 240, L = 40, R = 10, T = 14, B = 34, iw = W - L - R, ih = Hh - T - B;
  const bw = Math.min(46, iw / w.length * 0.7), step = iw / w.length;
  let s = `<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Доля осмотров с замечаниями по неделям">`;
  [0, 25, 50, 75, 100].forEach(p => {
    const y = T + ih - p / 100 * ih;
    s += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#E2E8F0"/><text x="${L - 6}" y="${y + 4}" font-size="11" text-anchor="end" fill="#64748B">${p}%</text>`;
  });
  w.forEach((x, i) => {
    const cx = L + step * i + step / 2, p = pct(x.withDefect, x.inspections), h = p / 100 * ih;
    s += `<rect x="${cx - bw / 2}" y="${T + ih - h}" width="${bw}" height="${h}" fill="${p >= 50 ? "#DC2626" : p > 0 ? "#F4A52A" : "#16A34A"}" rx="3"><title>Неделя с ${fmtD(x.week)}: ${x.withDefect} из ${x.inspections} осмотров с замечаниями (${p}%)</title></rect>`;
    if (p === 0) s += `<rect x="${cx - bw / 2}" y="${T + ih - 3}" width="${bw}" height="3" fill="#16A34A"/>`;
    if (i % Math.ceil(w.length / 16) === 0) s += `<text x="${cx}" y="${Hh - 18}" font-size="10" text-anchor="middle" fill="#64748B">${fmtDS(x.week)}</text>`;
    s += `<text x="${cx}" y="${Hh - 5}" font-size="9" text-anchor="middle" fill="#94A3B8">n=${x.inspections}</text>`;
  });
  return s + "</svg>";
}
function chartHours() {
  const h = H.hours; if (h.length < 2) return `<div class="sub">Недостаточно значений моточасов для графика (${h.length}).</div>`;
  const W = 1000, Hh = 220, L = 56, R = 12, T = 12, B = 26, iw = W - L - R, ih = Hh - T - B;
  const t0 = h[0].t, t1 = h[h.length - 1].t, vmin = Math.min(...h.map(x => x.h)), vmax = Math.max(...h.map(x => x.h));
  const span = Math.max(vmax - vmin, 1);
  const X = t => L + (t1 === t0 ? 0 : (t - t0) / (t1 - t0)) * iw, Y = v => T + ih - (v - vmin) / span * ih;
  let s = `<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Моточасы по датам">`;
  for (let k = 0; k <= 4; k++) {
    const v = vmin + span * k / 4, y = Y(v);
    s += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#E2E8F0"/><text x="${L - 6}" y="${y + 4}" font-size="11" text-anchor="end" fill="#64748B">${Math.round(v)}</text>`;
  }
  s += `<polyline fill="none" stroke="#1B3B6F" stroke-width="2" points="${h.map(x => X(x.t) + "," + Y(x.h)).join(" ")}"/>`;
  h.forEach(x => s += `<circle cx="${X(x.t)}" cy="${Y(x.h)}" r="3" fill="#F4A52A"><title>${fmtD(x.day)}: ${x.h} м/ч</title></circle>`);
  s += `<text x="${L}" y="${Hh - 6}" font-size="11" fill="#64748B">${fmtD(h[0].day)}</text><text x="${W - R}" y="${Hh - 6}" font-size="11" text-anchor="end" fill="#64748B">${fmtD(h[h.length - 1].day)}</text>`;
  return s + "</svg>";
}
function chartHeat() {
  const hm = heatmap(); if (!hm.rows.length) return `<div class="sub">Замечаний по пунктам в периоде нет.</div>`;
  const lw = 230, cw = Math.max(18, Math.min(40, 760 / hm.weeks.length)), rh = 24, W = lw + cw * hm.weeks.length + 10, Hh = 22 + rh * hm.rows.length + 24;
  let s = `<svg viewBox="0 0 ${W} ${Hh}" width="${W}" style="max-width:100%;height:auto" role="img" aria-label="Карта замечаний по пунктам и неделям">`;
  hm.rows.forEach((r, ri) => {
    const y = 22 + ri * rh, name = r.item.item.length > 34 ? r.item.item.slice(0, 33) + "…" : r.item.item;
    s += `<text x="${lw - 8}" y="${y + 16}" font-size="12" text-anchor="end" fill="#0B1A35"><title>${esc(r.item.section)} · ${esc(r.item.item)}</title>${esc(name)}</text>`;
    hm.weeks.forEach((w, ci) => {
      const n = hm.insPerWeek[w] || 0, d = r.cnt[w] || 0, fr = n ? d / n : 0;
      const fill = !n ? "#F1F5F9" : d === 0 ? "#DCFCE7" : fr >= 0.75 ? "#DC2626" : fr >= 0.4 ? "#F87171" : "#FCA5A5";
      s += `<rect x="${lw + ci * cw}" y="${y}" width="${cw - 2}" height="${rh - 2}" fill="${fill}" rx="3"><title>${esc(r.item.item)}, неделя с ${fmtD(w)}: замечание в ${d} из ${n} осмотров</title></rect>`;
    });
  });
  hm.weeks.forEach((w, ci) => { if (ci % Math.ceil(hm.weeks.length / 14) === 0) s += `<text x="${lw + ci * cw + cw / 2}" y="${Hh - 6}" font-size="10" text-anchor="middle" fill="#64748B">${fmtDS(w)}</text>`; });
  return s + "</svg>";
}

// ── Текстовое резюме ──────────────────────────────────────
function summaryText() {
  const S = H.summary, out = [];
  if (!S.inspections) return `<p><span class="tag">Факт</span>За выбранный период чек-листов по технике ${esc(H.equipmentId)} нет. Проверьте написание ID и даты (база осмотров начинается с ${fmtD(CFG.DB_START)}).</p>`;
  const span = dayDiff(S.firstDay, S.lastDay) + 1, gap = maxGap(H.daily);
  out.push(`<p><span class="tag">Факт</span>${esc(H.equipmentId)}${H.equipment && H.equipment.name ? " (" + esc(H.equipment.name) + ")" : ""}: ${S.inspections} ${plural(S.inspections, "осмотр", "осмотра", "осмотров")} в ${S.daysWithInspection} ${plural(S.daysWithInspection, "день", "дня", "дней")} с ${fmtD(S.firstDay)} по ${fmtD(S.lastDay)} (${span} дн. в окне). Замечания в ${S.withDefect} из ${S.inspections} осмотров (${pct(S.withDefect, S.inspections)}%).</p>`);
  if (H.from < S.firstDay && dayDiff(H.from, S.firstDay) > 7)
    out.push(`<p><span class="tag">Факт</span>Первый осмотр в базе — ${fmtD(S.firstDay)}, а запрошен период с ${fmtD(H.from)}. Что было раньше, по чек-листам сказать нельзя.</p>`);
  if (gap.n >= 7) out.push(`<p><span class="tag">Факт</span>Самый длинный перерыв без осмотров: ${gap.n} дн. (${fmtD(gap.a)} — ${fmtD(gap.b)}). В этот период данных нет, а не «замечаний нет».</p>`);
  const top = H.items.filter(i => i.defects > 0).slice(0, 3);
  if (top.length) out.push(`<p><span class="tag">Факт</span>Чаще всего отмечено: ${top.map(i => `«${esc(i.item)}» (${esc(i.section)}) — ${i.defects} из ${i.total} осмотров, ${pct(i.defects, i.total)}%`).join("; ")}.</p>`);
  const chronic = H.items.filter(i => i.currentState === "defect" && i.currentRun >= 2);
  chronic.slice(0, 4).forEach(i => out.push(`<p><span class="tag">Факт</span>«${esc(i.item)}»: замечание сохраняется в последних ${i.currentRun} ${plural(i.currentRun, "осмотре", "осмотрах", "осмотрах")} подряд, с ${fmtD(i.currentSince)} (${dayDiff(i.currentSince, S.lastDay)} дн. до последнего осмотра). Самая длинная серия в периоде: ${i.longestDefectRun} (${fmtDS(i.longestFrom)} — ${fmtDS(i.longestTo)}).</p>`));
  const flips = H.items.filter(i => i.defects > 0 && i.currentState === "ok" && i.currentRun >= 3);
  flips.slice(0, 3).forEach(i => out.push(`<p><span class="tag">Факт</span>«${esc(i.item)}»: последние ${i.currentRun} осмотров без замечаний (с ${fmtD(i.currentSince)}), до этого замечания были (${i.defects}). Сверьте с журналом ремонтов: чек-лист показывает отметку оператора, а не факт ремонта.</p>`));
  if (H.hourSummary) out.push(`<p><span class="tag">Факт</span>Моточасы: ${H.hourSummary.first.h} (${fmtD(H.hourSummary.first.day)}) → ${H.hourSummary.last.h} (${fmtD(H.hourSummary.last.day)}), прирост ${H.hourSummary.delta} м/ч по ${H.hourSummary.points} замерам. Значение вводит оператор, ошибки ввода не отфильтрованы.</p>`);
  else out.push(`<p><span class="tag">Факт</span>Моточасов в чек-листах за период не найдено.</p>`);
  out.push(`<p class="sub"><span class="tag">Ограничение</span>Отметка «замечание» — это запись оператора по QR-осмотру. Причины и сроки устранения в чек-листах не фиксируются.</p>`);
  return out.join("");
}

// ── Рендер ────────────────────────────────────────────────
function render() {
  const S = H.summary, r = $("result");
  const openItems = H.items.filter(i => i.currentState === "defect").length;
  r.innerHTML = `
  <div class="panel summary"><div class="panel-title">Резюме</div>${summaryText()}</div>
  ${S.inspections ? `
  <div class="cards">
    <div class="card"><div class="v">${S.inspections}</div><div class="l">осмотров</div></div>
    <div class="card ${S.withDefect ? "red" : ""}"><div class="v">${pct(S.withDefect, S.inspections)}%</div><div class="l">осмотров с замечаниями (${S.withDefect})</div></div>
    <div class="card"><div class="v">${S.daysWithInspection}</div><div class="l">дней с осмотром из ${H.periodDays}</div></div>
    <div class="card ${openItems ? "red" : ""}"><div class="v">${openItems}</div><div class="l">пунктов с замечанием в последнем осмотре</div></div>
    <div class="card"><div class="v">${H.hourSummary ? "+" + H.hourSummary.delta : "—"}</div><div class="l">м/ч за период</div></div>
  </div>
  <div class="panel"><div class="panel-title">Доля осмотров с замечаниями по неделям</div><div class="sub" style="margin-bottom:6px">Столбец — неделя (с понедельника), n — число осмотров за неделю. Зелёная полоска — замечаний нет.</div>${chartWeekly()}</div>
  <div class="panel"><div class="panel-title">Карта замечаний: пункт × неделя</div><div class="sub" style="margin-bottom:6px">Красный — замечание в большей части осмотров недели, светло-зелёный — осмотры были, замечаний нет, серый — осмотров не было.</div><div class="scroll">${chartHeat()}</div></div>
  <div class="panel"><div class="panel-title">Моточасы</div>${chartHours()}</div>
  <div class="panel"><div class="panel-title">Пункты чек-листа</div><div class="sub" style="margin-bottom:6px">Нажмите на строку — ниже появятся комментарии по пункту.</div><div class="scroll">${itemsTable()}</div></div>
  <div class="panel"><div class="panel-title" id="cmTitle">Комментарии</div><div id="cmBox"></div></div>
  <div class="panel"><div class="panel-title">Операторы</div><div class="scroll">${opsTable()}</div></div>
  <div class="panel"><div class="panel-title">Осмотры (последние 40)</div><div class="scroll">${inspTable()}</div></div>
  ` : ""}`;
  if (S.inspections) renderComments();
}
function itemsTable() {
  const rows = H.items.map(i => {
    const k = itemKey(i.section, i.item), p = pct(i.defects, i.total);
    const st = i.currentState === "defect" ? `<span class="state-def">замечание, ${i.currentRun} ос. подряд с ${fmtDS(i.currentSince)}</span>` : `<span class="state-ok">ок, ${i.currentRun} ос. с ${fmtDS(i.currentSince)}</span>`;
    return `<tr class="clk ${SELECTED === k ? "sel" : ""}" data-k="${esc(k)}" onclick="selectItem(this.dataset.k)"><td>${esc(i.section)}</td><td>${esc(i.item)}</td><td>${i.total}</td><td>${i.defects}</td><td><span class="barbg"><div class="bar" style="width:${p}%"></div></span> ${p}%</td><td>${st}</td><td>${i.defects ? i.longestDefectRun + " (" + fmtDS(i.longestFrom) + "—" + fmtDS(i.longestTo) + ")" : "—"}</td><td>${fmtDS(i.firstDefect)}</td><td>${fmtDS(i.lastDefect)}</td></tr>`;
  }).join("");
  return `<table><thead><tr><th>Раздел</th><th>Пункт</th><th>Осмотров</th><th>Замеч.</th><th>Доля</th><th>Сейчас</th><th>Макс. серия</th><th>Первое</th><th>Последнее</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function opsTable() {
  return `<table><thead><tr><th>Оператор</th><th>Осмотров</th><th>С замечаниями</th><th>Доля</th></tr></thead><tbody>${H.operators.map(o => `<tr><td>${esc(o.op || "—")}</td><td>${o.inspections}</td><td>${o.withDefect}</td><td>${pct(o.withDefect, o.inspections)}%</td></tr>`).join("")}</tbody></table>`;
}
function inspTable() {
  const rows = H.inspections.slice(-40).reverse().map(x => `<tr><td>${fmtD(x.day)}</td><td>${esc(x.op)}</td><td>${x.hours == null ? "—" : x.hours}</td><td>${x.ok}</td><td>${x.defects.length ? x.defects.map(d => esc(d.item) + (d.comment ? " (" + esc(d.comment) + ")" : "")).join("; ") : "—"}</td></tr>`).join("");
  return `<table><thead><tr><th>Дата</th><th>Оператор</th><th>М/ч</th><th>Ок</th><th>Замечания</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function selectItem(k) {
  SELECTED = SELECTED === k ? null : k;
  document.querySelectorAll("tr.clk").forEach(tr => tr.classList.toggle("sel", tr.dataset.k === SELECTED));
  renderComments();
}
function renderComments() {
  const list = H.comments.filter(c => !SELECTED || itemKey(c.section, c.item) === SELECTED).slice().reverse();
  $("cmTitle").textContent = SELECTED ? "Комментарии: " + SELECTED.split(" | ")[1] : "Комментарии (все пункты, последние 300)";
  $("cmBox").innerHTML = list.length ? list.slice(0, 80).map(c => `<div class="cm"><div class="m">${fmtD(c.day)} · ${esc(c.op)} · ${esc(c.item)}${c.defect ? " · замечание" : ""}</div>${esc(c.comment)}</div>`).join("") : `<div class="sub">Комментариев нет.</div>`;
}

// ── Excel ─────────────────────────────────────────────────
function exportXlsx() {
  if (!H || !H.summary.inspections) return;
  const wb = XLSX.utils.book_new();
  const S = H.summary;
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
    ["Техника", H.equipmentId], ["Период", fmtD(H.from) + " — " + fmtD(H.to)],
    ["Осмотров", S.inspections], ["С замечаниями", S.withDefect], ["Дней с осмотром", S.daysWithInspection],
    ["Первый осмотр", S.firstDay], ["Последний осмотр", S.lastDay],
    ["Моточасы: первое", H.hourSummary ? H.hourSummary.first.h : ""], ["Моточасы: последнее", H.hourSummary ? H.hourSummary.last.h : ""], ["Прирост м/ч", H.hourSummary ? H.hourSummary.delta : ""]
  ]), "Сводка");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Неделя с", "Осмотров", "С замечаниями", "Замечаний (пунктов)", "Доля, %"]].concat(H.weekly.map(w => [w.week, w.inspections, w.withDefect, w.defectItems, pct(w.withDefect, w.inspections)]))), "Недели");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Раздел", "Пункт", "Осмотров", "Замечаний", "Доля, %", "Сейчас", "Серия подряд", "С даты", "Макс. серия", "Первое замечание", "Последнее замечание"]].concat(H.items.map(i => [i.section, i.item, i.total, i.defects, pct(i.defects, i.total), i.currentState === "defect" ? "замечание" : "ок", i.currentRun, i.currentSince, i.longestDefectRun, i.firstDefect || "", i.lastDefect || ""]))), "Пункты");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Дата", "Оператор", "Моточасы", "Ок", "Замечания", "ID осмотра"]].concat(H.inspections.map(x => [x.day, x.op, x.hours == null ? "" : x.hours, x.ok, x.defects.map(d => d.item + (d.comment ? " (" + d.comment + ")" : "")).join("; "), x.recordId]))), "Осмотры");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Дата", "Оператор", "Раздел", "Пункт", "Замечание", "Комментарий"]].concat(H.comments.map(c => [c.day, c.op, c.section, c.item, c.defect ? "да" : "", c.comment]))), "Комментарии");
  XLSX.writeFile(wb, `История_${H.equipmentId}_${H.from}_${H.to}.xlsx`);
}
</script>
</body>
</html>
