<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обучение — Caravan Resources</title>
<style>
:root {
  --navy:#0B1A35; --navy2:#1B3B6F; --gold:#F4A52A;
  --red:#DC2626; --redbg:#FEF2F2;
  --green:#16A34A; --greenbg:#F0FDF4;
  --yellow:#B45309; --yellowbg:#FFFBEB;
  --gray:#64748B; --light:#F1F5F9; --border:#E2E8F0;
}
* { box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--light); color:var(--navy); margin:0; min-height:100vh; }

#loginScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; }
.login-box { background:#fff; border-radius:16px; padding:36px; width:320px; text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.1); }
.login-logo { font-size:36px; margin-bottom:10px; }
.login-title { font-size:17px; font-weight:800; color:var(--navy); }
.login-sub { font-size:12px; color:var(--gray); margin:4px 0 20px; }
.login-box input { width:100%; padding:12px; border:1.5px solid var(--border); border-radius:10px;
  font-size:15px; margin-bottom:12px; text-align:center; }
.login-box button { width:100%; padding:12px; border:none; border-radius:10px; background:var(--gold);
  color:var(--navy); font-weight:800; font-size:15px; cursor:pointer; }
.login-err { display:none; color:var(--red); font-size:12px; margin-top:10px; }

#app { display:none; }
.header { background:var(--navy); color:#fff; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; }
.header h1 { font-size:16px; font-weight:800; margin:0; }
.header p { font-size:11px; color:rgba(255,255,255,.6); margin:2px 0 0; }
.header button { background:rgba(255,255,255,.1); color:#fff; border:none; padding:8px 14px;
  border-radius:8px; cursor:pointer; font-size:13px; }

.navbar { background:#fff; border-bottom:1px solid var(--border); padding:0 16px; display:flex;
  gap:4px; overflow-x:auto; }
.navbar button { background:none; border:none; padding:12px 14px; font-size:13px; font-weight:700;
  color:var(--gray); cursor:pointer; white-space:nowrap; border-bottom:3px solid transparent; }
.navbar button.active { color:var(--navy); border-bottom-color:var(--gold); }

.wrap { max-width:1100px; margin:0 auto; padding:20px; }
.screen { display:none; }
.screen.active { display:block; }
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
.stat-card { background:#fff; border-radius:12px; padding:16px; border-left:4px solid var(--gold); }
.stat-val { font-size:24px; font-weight:800; }
.stat-lbl { font-size:12px; color:var(--gray); margin-top:2px; }

.panel { background:#fff; border-radius:14px; padding:18px; margin-bottom:16px; }
.panel-title { font-size:14px; font-weight:800; color:var(--navy); margin-bottom:12px;
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
.empty { text-align:center; padding:24px; color:var(--gray); font-size:13px; }
.empty-icon { font-size:28px; margin-bottom:8px; }
.btn-ghost { background:var(--light); color:var(--navy); border:none; padding:8px 12px;
  border-radius:8px; cursor:pointer; font-size:13px; }
.btn-gold { background:var(--gold); color:var(--navy); border:none; padding:8px 12px;
  border-radius:8px; cursor:pointer; font-size:13px; font-weight:700; }
.btn-red { background:var(--redbg); color:var(--red); border:none; padding:8px 12px;
  border-radius:8px; cursor:pointer; font-size:13px; font-weight:700; }
.btn-green { background:var(--greenbg); color:var(--green); border:none; padding:8px 12px;
  border-radius:8px; cursor:pointer; font-size:13px; font-weight:700; }
input[type=text], input[type=date], select { width:100%; padding:10px 12px; border:1.5px solid var(--border);
  border-radius:10px; font-size:14px; }
label { font-size:12px; color:var(--gray); font-weight:600; display:block; margin-bottom:4px; }
.field { margin-bottom:12px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; padding:8px; color:var(--gray); font-size:11px; text-transform:uppercase;
  border-bottom:2px solid var(--border); }
td { padding:8px; border-bottom:1px solid var(--border); }
.badge { font-weight:700; font-size:12px; padding:3px 8px; border-radius:6px; white-space:nowrap; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">📋</div>
    <div class="login-title">Обучение</div>
    <div class="login-sub">Caravan Resources · план и учёт курсов</div>
    <input type="password" id="pinInput" placeholder="Введите PIN-код"
      onkeydown="if(event.key==='Enter')checkPin()">
    <button onclick="checkPin()">Войти</button>
    <div class="login-err" id="loginErr">Неверный PIN-код</div>
  </div>
</div>

<div id="app">
  <div class="header">
    <div>
      <h1>Обучение</h1>
      <p>Caravan Resources · <span id="loadStatus">загрузка...</span></p>
    </div>
    <button onclick="logout()">Выйти</button>
  </div>

  <div class="navbar">
    <button id="navPlan" class="active" onclick="showScreen('plan')">📋 План</button>
    <button id="navHistory" onclick="showScreen('history')">✅ История</button>
    <button id="navCatalog" onclick="showScreen('catalog')">📚 Каталог курсов</button>
  </div>

  <div class="wrap">
    <div id="loadErrorBanner" style="display:none;background:var(--red);color:#fff;
      padding:12px 16px;border-radius:8px;font-size:13px;font-weight:700;margin-bottom:14px">
      ⚠ Часть данных не загрузилась. То, что показано — может быть неполным.
      <button onclick="loadAll()" style="margin-left:10px;background:#fff;color:var(--red);
        border:none;padding:4px 12px;border-radius:6px;font-weight:800;cursor:pointer">Повторить</button>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap">
      <span style="font-size:13px;color:var(--gray);font-weight:600">Участок:</span>
      <div id="siteSwitch" style="display:flex;gap:8px"></div>
    </div>

    <!-- ══ ПЛАН ══ -->
    <div id="screenPlan" class="screen active">
      <div class="panel">
        <div class="panel-title">➕ Назначить курс</div>
        <div style="display:grid;grid-template-columns:1fr;gap:0" id="planFormGrid">
          <div class="field">
            <label>Сотрудник</label>
            <input type="text" id="planEmpInput" list="planEmpList" placeholder="Начните вводить имя...">
            <datalist id="planEmpList"></datalist>
          </div>
          <div class="field">
            <label>Курс</label>
            <select id="planCourseSelect"><option value="">— выберите курс —</option></select>
          </div>
          <div class="field">
            <label>Срок (до какой даты пройти)</label>
            <input type="date" id="planDueDate">
          </div>
          <button class="btn-gold" onclick="submitPlan()">Добавить в план</button>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">Запланировано — <span id="planSiteLabel"></span> (<span id="planCount">0</span>)</div>
        <div id="planList"></div>
      </div>
    </div>

    <!-- ══ ИСТОРИЯ ══ -->
    <div id="screenHistory" class="screen">
      <div class="panel">
        <input type="text" id="historySearch" placeholder="🔍 Поиск по имени или курсу..." oninput="renderHistory()">
      </div>
      <div class="panel">
        <div class="panel-title">Пройдено — <span id="historySiteLabel"></span></div>
        <div id="historyList"></div>
      </div>
    </div>

    <!-- ══ КАТАЛОГ КУРСОВ ══ -->
    <div id="screenCatalog" class="screen">
      <div class="panel">
        <div class="panel-title">➕ Добавить курс в каталог</div>
        <div style="display:flex;gap:8px">
          <input type="text" id="catalogNewCourse" placeholder="Название курса...">
          <button class="btn-gold" onclick="submitCatalogAdd()">Добавить</button>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">Каталог (<span id="catalogCount">0</span>)</div>
        <div id="catalogList"></div>
      </div>
    </div>
  </div>
</div>

<div id="modalOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
  align-items:center;justify-content:center;z-index:1000;padding:16px">
  <div id="modalBox" style="background:#fff;border-radius:14px;padding:22px;max-width:480px;width:100%;
    max-height:85vh;overflow-y:auto"></div>
</div>

<script>
const CFG = {
  PIN: "1234",
  SHEET_URL: "https://script.google.com/macros/s/AKfycbwhdMV20k8US2BXUz1Xk2XCXE9MEwpHpQaadTF9xEfzbU1--dHL-Zuj06K2qXW-rFtKGw/exec",
};

let DATA = { employees: [], trainingPlan: [], trainingHistory: [], courseCatalog: [] };
let CURRENT_SITE = "Алмалы";

function checkPin() {
  const val = document.getElementById("pinInput").value;
  if (val === CFG.PIN) {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "block";
    loadAll();
  } else {
    document.getElementById("loginErr").style.display = "block";
    document.getElementById("pinInput").value = "";
    document.getElementById("pinInput").focus();
  }
}
function logout() {
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("app").style.display = "none";
  document.getElementById("pinInput").value = "";
}

function showScreen(name) {
  ["plan","history","catalog"].forEach(s => {
    document.getElementById("screen"+s.charAt(0).toUpperCase()+s.slice(1)).classList.remove("active");
    document.getElementById("nav"+s.charAt(0).toUpperCase()+s.slice(1)).classList.remove("active");
  });
  document.getElementById("screen"+name.charAt(0).toUpperCase()+name.slice(1)).classList.add("active");
  document.getElementById("nav"+name.charAt(0).toUpperCase()+name.slice(1)).classList.add("active");
}

// Запрос с таймаутом и повтором — тот же проверенный способ, что и в
// остальных приложениях: пауза растёт с каждой попыткой, чтобы не душить
// и без того слабый канал повторными запросами подряд.
async function fetchWithRetry(url, timeoutMs, attempts) {
  const tries = attempts || 3;
  let lastErr;
  for (let i = 0; i < tries; i++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs || 40000);
    try {
      const r = await fetch(url, { cache: "no-store", signal: ctrl.signal });
      clearTimeout(timer);
      return await r.json();
    } catch (e) {
      clearTimeout(timer);
      lastErr = e;
      if (i < tries - 1) await new Promise(res => setTimeout(res, 1500 * (i + 1)));
    }
  }
  throw lastErr;
}

async function loadAll(onlyKeys) {
  const banner = document.getElementById("loadErrorBanner");
  if (banner) banner.style.display = "none";
  const statusEl = document.getElementById("loadStatus");
  renderSiteSwitch(); // сразу, не дожидаясь первого сетевого ответа — иначе на слабой связи участок долго не виден

  // employees и trainingPlan — сервер фильтрует по участку (&site=...).
  // trainingHistory (getTraining) и courseCatalog — общие списки без
  // серверного фильтра: история фильтруется по участку на клиенте через
  // join с employees (там своего site нет, как и у заправок), а каталог
  // курсов общий для всей компании независимо от участка.
  const fetchDefs = [
    { key: "employees",       action: "list",             siteScoped: true },
    { key: "trainingPlan",    action: "getTrainingPlan",  siteScoped: true },
    { key: "trainingHistory", action: "getTraining" },
    { key: "courseCatalog",   action: "getCourseCatalog" },
  ];
  const fetches = onlyKeys ? fetchDefs.filter(f => onlyKeys.includes(f.key)) : fetchDefs;

  let failed = false;
  for (let i = 0; i < fetches.length; i++) {
    const f = fetches[i];
    if (statusEl) statusEl.textContent = `загрузка... ${i+1} из ${fetches.length}${onlyKeys ? " (обновляю)" : ""}`;
    try {
      const url = f.siteScoped
        ? `${CFG.SHEET_URL}?action=${f.action}&site=${encodeURIComponent(CURRENT_SITE)}`
        : `${CFG.SHEET_URL}?action=${f.action}`;
      const val = await fetchWithRetry(url, 60000, 3);
      if (Array.isArray(val)) DATA[f.key] = val; else failed = true;
    } catch (e) {
      failed = true;
      console.error(f.key + ":", e);
    }
    try { renderAll(); } catch(e) { console.error("Отрисовка:", e); }
  }

  if (statusEl) statusEl.textContent = failed ? "часть данных не загрузилась" : "данные загружены";
  if (banner) banner.style.display = failed ? "block" : "none";
  renderAll();
}

function renderAll() {
  renderSiteSwitch();
  renderEmpDatalist();
  renderCourseSelect();
  renderPlanList();
  renderHistory();
  renderCatalogList();
}

function renderSiteSwitch() {
  const el = document.getElementById("siteSwitch");
  if (!el) return;
  el.innerHTML = ["Алмалы","Ашыктас"].map(s => `
    <button class="${CURRENT_SITE===s?'btn-gold':'btn-ghost'}" onclick="setSite('${s}')">${s}</button>
  `).join("");
}
function setSite(site) {
  if (site === CURRENT_SITE) return;
  CURRENT_SITE = site;
  renderSiteSwitch();
  loadAll();
}

// ── Даты: в базе встречаются и настоящие Date-ячейки (сериализуются в
// ISO вида 2026-07-01T19:00:00.000Z), и текстовые dd.mm.yyyy. new Date()
// на dd.mm.yyyy молча разбирает это как американский формат (mm.dd.yyyy) —
// известная ловушка этого проекта. Парсим оба формата явно.
function parseAnyDate(v) {
  if (!v) return null;
  if (v instanceof Date) return isNaN(v) ? null : v;
  const s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
    const d = new Date(s);
    return isNaN(d) ? null : d;
  }
  const m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if (m) {
    const d = new Date(Number(m[3]), Number(m[2])-1, Number(m[1]));
    return isNaN(d) ? null : d;
  }
  return null;
}
function formatRu(d) {
  if (!d) return "—";
  return d.toLocaleDateString("ru-RU", { day:"2-digit", month:"2-digit", year:"numeric" });
}
function isoToRu(iso) {
  // "2026-07-02" (из <input type=date>) → "02.07.2026", формат остальных записей в базе
  const m = String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[3]}.${m[2]}.${m[1]}` : "";
}
function daysUntil(d) {
  if (!d) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  return Math.round((dd - now) / 86400000);
}

function empById(id) { return (DATA.employees||[]).find(e => String(e.id)===String(id)); }

function renderEmpDatalist() {
  const el = document.getElementById("planEmpList");
  if (!el) return;
  el.innerHTML = (DATA.employees||[])
    .slice().sort((a,b)=>a.name.localeCompare(b.name))
    .map(e => `<option value="${e.name.replace(/"/g,'&quot;')} [${e.id}]">`).join("");
}
// Достаём empId из строки вида "Имя Фамилия [123]", которую оставляет datalist
function empIdFromInput(text) {
  const m = String(text||"").match(/\[([^\]]+)\]\s*$/);
  return m ? m[1] : "";
}

function renderCourseSelect() {
  const el = document.getElementById("planCourseSelect");
  if (!el) return;
  const cur = el.value;
  el.innerHTML = `<option value="">— выберите курс —</option>` +
    (DATA.courseCatalog||[]).map(c => `<option value="${c.replace(/"/g,'&quot;')}">${c}</option>`).join("");
  if ((DATA.courseCatalog||[]).includes(cur)) el.value = cur;
}

// ══════════════════════════════════════════════════════════
// ПЛАН
// ══════════════════════════════════════════════════════════
async function submitPlan() {
  const empText = document.getElementById("planEmpInput").value;
  const empId = empIdFromInput(empText);
  const emp = empById(empId);
  const course = document.getElementById("planCourseSelect").value;
  const dueIso = document.getElementById("planDueDate").value;

  if (!emp) { alert("Выберите сотрудника из списка подсказок (начните печатать имя)"); return; }
  if (!course) { alert("Выберите курс"); return; }

  try {
    const res = await fetch(CFG.SHEET_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "addTrainingPlan",
        empId: emp.id, empName: emp.name, course,
        dueDate: dueIso ? isoToRu(dueIso) : "",
        site: CURRENT_SITE,
      }),
    });
    const val = await res.json();
    if (!val.ok) { alert("Не удалось добавить: " + (val.error||"")); return; }
    document.getElementById("planEmpInput").value = "";
    document.getElementById("planCourseSelect").value = "";
    document.getElementById("planDueDate").value = "";
    await loadAll(["trainingPlan"]);
  } catch (e) {
    alert("Ошибка сети: " + e.message);
  }
}

function renderPlanList() {
  const el = document.getElementById("planList");
  const lbl = document.getElementById("planSiteLabel");
  const cnt = document.getElementById("planCount");
  if (!el) return;
  if (lbl) lbl.textContent = CURRENT_SITE;

  const list = (DATA.trainingPlan||[]).slice().sort((a,b) => {
    const da = parseAnyDate(a.dueDate), db = parseAnyDate(b.dueDate);
    if (!da && !db) return 0;
    if (!da) return 1;
    if (!db) return -1;
    return da - db;
  });
  if (cnt) cnt.textContent = list.length;

  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">✓</div>Ничего не запланировано</div>`;
    return;
  }

  el.innerHTML = list.map(p => {
    const due = parseAnyDate(p.dueDate);
    const days = daysUntil(due);
    let badge;
    if (days === null) badge = `<span class="badge" style="background:var(--light);color:var(--gray)">Без срока</span>`;
    else if (days < 0) badge = `<span class="badge" style="background:var(--redbg);color:var(--red)">Просрочено на ${-days} дн.</span>`;
    else if (days <= 7) badge = `<span class="badge" style="background:var(--yellowbg);color:var(--yellow)">Осталось ${days} дн.</span>`;
    else badge = `<span class="badge" style="background:var(--greenbg);color:var(--green)">До ${formatRu(due)}</span>`;

    return `<div style="padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap">
        <div>
          <div style="font-weight:800">${p.empName}</div>
          <div style="font-size:13px;color:var(--gray);margin-top:2px">${p.course}</div>
        </div>
        ${badge}
      </div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn-green" onclick="openCompleteModal(${p.__row}, '${String(p.empId).replace(/'/g,"\\'")}', '${p.empName.replace(/'/g,"\\'")}', '${p.course.replace(/'/g,"\\'")}')">✓ Пройден</button>
        <button class="btn-red" onclick="cancelPlan(${p.__row})">✕ Отменить</button>
      </div>
    </div>`;
  }).join("");
}

async function cancelPlan(row) {
  if (!confirm("Отменить этот план без прохождения?")) return;
  try {
    const res = await fetch(CFG.SHEET_URL, { method:"POST", body: JSON.stringify({ action:"deleteTrainingPlan", row }) });
    const val = await res.json();
    if (!val.ok) { alert("Не удалось отменить: " + (val.error||"")); return; }
    await loadAll(["trainingPlan"]);
  } catch (e) { alert("Ошибка сети: " + e.message); }
}

function openCompleteModal(row, empId, empName, course) {
  const today = new Date().toISOString().slice(0,10);
  document.getElementById("modalBox").innerHTML = `
    <div style="font-size:16px;font-weight:800;margin-bottom:4px">Отметить пройденным</div>
    <div style="font-size:13px;color:var(--gray);margin-bottom:16px">${empName} — ${course}</div>
    <div class="field">
      <label>Дата прохождения</label>
      <input type="date" id="completeDate" value="${today}">
    </div>
    <div class="field">
      <label>Действует до (необязательно — для периодических инструктажей)</label>
      <input type="date" id="completeValidUntil">
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn-gold" style="flex:1" onclick="submitComplete(${row}, '${String(empId).replace(/'/g,"\\'")}', '${empName.replace(/'/g,"\\'")}', '${course.replace(/'/g,"\\'")}')">Сохранить</button>
      <button class="btn-ghost" style="flex:1" onclick="closeModal()">Отмена</button>
    </div>
  `;
  document.getElementById("modalOverlay").style.display = "flex";
}
async function submitComplete(row, empId, empName, course) {
  const dateIso = document.getElementById("completeDate").value;
  const validIso = document.getElementById("completeValidUntil").value;
  try {
    const res = await fetch(CFG.SHEET_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "completeTrainingPlan", row, empId, empName, course,
        date: dateIso ? isoToRu(dateIso) : "",
        validUntil: validIso ? isoToRu(validIso) : "",
      }),
    });
    const val = await res.json();
    if (!val.ok) { alert("Не удалось сохранить: " + (val.error||"")); return; }
    closeModal();
    await loadAll(["trainingPlan", "trainingHistory"]);
  } catch (e) { alert("Ошибка сети: " + e.message); }
}
function closeModal() { document.getElementById("modalOverlay").style.display = "none"; }

// ══════════════════════════════════════════════════════════
// ИСТОРИЯ — «Обучение» без своего site, фильтруем через join с employees
// (тот же приём, что и у заправок на бэкенде, только на клиенте, т.к.
// список сотрудников уже под рукой и его не нужно грузить второй раз).
// ══════════════════════════════════════════════════════════
function renderHistory() {
  const el = document.getElementById("historyList");
  const lbl = document.getElementById("historySiteLabel");
  if (!el) return;
  if (lbl) lbl.textContent = CURRENT_SITE;
  const q = (document.getElementById("historySearch")?.value||"").toLowerCase().trim();

  const siteEmpIds = new Set((DATA.employees||[]).map(e => String(e.id)));
  let list = (DATA.trainingHistory||[]).filter(r => siteEmpIds.has(String(r.empId)));
  if (q) list = list.filter(r => (r.empName||"").toLowerCase().includes(q) || (r.course||"").toLowerCase().includes(q));
  list.sort((a,b) => (parseAnyDate(b.date)||0) - (parseAnyDate(a.date)||0));

  if (!DATA.employees.length || !DATA.trainingHistory.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">⏳</div>Загружаю...</div>`;
    return;
  }
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div>Ничего не найдено</div>`;
    return;
  }

  const shown = list.slice(0, 100);
  el.innerHTML = `<div style="overflow-x:auto"><table>
    <thead><tr><th>Сотрудник</th><th>Курс</th><th>Дата</th><th>Действует до</th></tr></thead>
    <tbody>${shown.map(r => `
      <tr>
        <td><b>${r.empName}</b></td>
        <td style="color:var(--gray)">${r.course}</td>
        <td>${formatRu(parseAnyDate(r.date))}</td>
        <td>${r.validUntil ? formatRu(parseAnyDate(r.validUntil)) : "—"}</td>
      </tr>`).join("")}</tbody>
  </table></div>` + (list.length>100 ? `<div style="text-align:center;color:var(--gray);font-size:12px;padding-top:10px">Показаны последние 100 из ${list.length} — уточните поиск</div>` : "");
}

// ══════════════════════════════════════════════════════════
// КАТАЛОГ КУРСОВ
// ══════════════════════════════════════════════════════════
async function submitCatalogAdd() {
  const input = document.getElementById("catalogNewCourse");
  const name = input.value.trim();
  if (!name) return;
  try {
    const res = await fetch(CFG.SHEET_URL, { method:"POST", body: JSON.stringify({ action:"addCourseCatalog", course: name }) });
    const val = await res.json();
    if (!val.ok) { alert("Не удалось добавить: " + (val.error||"")); return; }
    input.value = "";
    await loadAll(["courseCatalog"]);
  } catch (e) { alert("Ошибка сети: " + e.message); }
}
async function deleteCatalogItem(name) {
  if (!confirm(`Удалить «${name}» из каталога? Уже созданные записи плана/истории не изменятся.`)) return;
  try {
    const res = await fetch(CFG.SHEET_URL, { method:"POST", body: JSON.stringify({ action:"deleteCourseCatalog", course: name }) });
    const val = await res.json();
    if (!val.ok) { alert("Не удалось удалить: " + (val.error||"")); return; }
    await loadAll(["courseCatalog"]);
  } catch (e) { alert("Ошибка сети: " + e.message); }
}
function renderCatalogList() {
  const el = document.getElementById("catalogList");
  const cnt = document.getElementById("catalogCount");
  if (!el) return;
  const list = (DATA.courseCatalog||[]).slice().sort((a,b)=>a.localeCompare(b));
  if (cnt) cnt.textContent = list.length;
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📚</div>Каталог пуст — добавьте первый курс выше</div>`;
    return;
  }
  el.innerHTML = list.map(c => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)">
      <span>${c}</span>
      <button class="btn-red" onclick="deleteCatalogItem('${c.replace(/'/g,"\\'")}')">Удалить</button>
    </div>`).join("");
}
</script>
