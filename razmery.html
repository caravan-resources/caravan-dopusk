<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Размер одежды и обуви — Caravan Resources</title>
<style>
:root {
  --navy:#0B1A35; --navy2:#1B3B6F; --gold:#F4A52A;
  --red:#DC2626; --redbg:#FEF2F2;
  --green:#16A34A; --greenbg:#F0FDF4;
  --gray:#64748B; --light:#F1F5F9; --border:#E2E8F0;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--light); color:var(--navy); min-height:100vh;
}
.wrap { max-width:480px; margin:0 auto; padding:20px 16px 60px; }
.header {
  background:var(--navy); color:#fff; padding:20px 16px; margin:-20px -16px 20px;
  text-align:center;
}
.header h1 { font-size:17px; font-weight:800; }
.header p { font-size:12px; color:rgba(255,255,255,.6); margin-top:4px; }

.card {
  background:#fff; border-radius:14px; padding:18px; margin-bottom:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

input, select {
  width:100%; padding:13px 14px; border:1.5px solid var(--border); border-radius:10px;
  font-size:15px; font-family:inherit; outline:none; margin-bottom:10px;
}
input:focus, select:focus { border-color:var(--gold); }

.btn {
  width:100%; padding:14px; border:none; border-radius:10px;
  font-size:15px; font-weight:800; cursor:pointer; font-family:inherit;
}
.btn-gold { background:var(--gold); color:var(--navy); }
.btn-ghost { background:var(--light); color:var(--navy); }
.btn:disabled { opacity:.5; cursor:not-allowed; }

.emp-item {
  display:flex; align-items:center; gap:10px; width:100%;
  padding:12px; border:1.5px solid var(--border); border-radius:10px;
  background:#fff; cursor:pointer; margin-bottom:8px; text-align:left;
  font-family:inherit; font-size:14px;
}
.emp-item:active { background:var(--light); }
.emp-avatar {
  width:36px; height:36px; border-radius:50%; background:var(--navy2); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;
  flex-shrink:0;
}
.emp-name { font-weight:700; color:var(--navy); }
.emp-pos { font-size:12px; color:var(--gray); margin-top:1px; }

.selected-box {
  display:flex; align-items:center; gap:10px; padding:12px;
  background:var(--greenbg); border:1.5px solid var(--green); border-radius:10px;
  margin-bottom:14px;
}
.selected-box .name { font-weight:700; color:var(--navy); }
.selected-box .change { margin-left:auto; font-size:12px; color:var(--navy2); cursor:pointer; text-decoration:underline; }

.hint { font-size:12px; color:var(--gray); margin-bottom:10px; line-height:1.5; }
.label { font-size:12px; font-weight:700; color:var(--gray); margin-bottom:6px; display:block; }

.success-box { text-align:center; padding:40px 16px; }
.success-icon { font-size:48px; margin-bottom:16px; }
.success-title { font-size:18px; font-weight:800; color:var(--navy); margin-bottom:8px; }
.success-sub { font-size:13px; color:var(--gray); line-height:1.6; }

#screenSearch, #screenForm, #screenSuccess { display:none; }
#screenSearch.active, #screenForm.active, #screenSuccess.active { display:block; }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <h1>Размер одежды и обуви</h1>
    <p>Caravan Resources · для уже работающих сотрудников</p>
  </div>

  <div id="screenSearch" class="active">
    <div class="card">
      <div class="hint">Эта анкета — только для тех, кто уже есть в базе. Если вы новый человек — заполните
        <a href="anketa.html">полную анкету сотрудника</a>.</div>
      <input type="text" id="empSearch" placeholder="🔍 Введите фамилию..." oninput="renderEmpList(this.value)">
      <div id="empList"></div>
    </div>
  </div>

  <div id="screenForm">
    <div class="card">
      <div id="selectedBoxWrap"></div>

      <label class="label">Размер одежды</label>
      <select id="fClothingSize">
        <option value="">— выберите —</option>
        <option value="44">44</option>
        <option value="46">46</option>
        <option value="48">48</option>
        <option value="50">50</option>
        <option value="52">52</option>
        <option value="54">54</option>
        <option value="56">56</option>
        <option value="58">58</option>
        <option value="60">60</option>
        <option value="62">62</option>
        <option value="64">64</option>
        <option value="66">66</option>
        <option value="68">68</option>
        <option value="70">70</option>
      </select>

      <label class="label">Размер обуви</label>
      <select id="fShoeSize">
        <option value="">— выберите —</option>
        <option value="36">36</option>
        <option value="37">37</option>
        <option value="38">38</option>
        <option value="39">39</option>
        <option value="40">40</option>
        <option value="41">41</option>
        <option value="42">42</option>
        <option value="43">43</option>
        <option value="44">44</option>
        <option value="45">45</option>
        <option value="46">46</option>
        <option value="47">47</option>
        <option value="48">48</option>
      </select>

      <label class="label">Размер зимней одежды</label>
      <select id="fWinterClothingSize">
        <option value="">— выберите —</option>
        <option value="44">44</option>
        <option value="46">46</option>
        <option value="48">48</option>
        <option value="50">50</option>
        <option value="52">52</option>
        <option value="54">54</option>
        <option value="56">56</option>
        <option value="58">58</option>
        <option value="60">60</option>
        <option value="62">62</option>
        <option value="64">64</option>
        <option value="66">66</option>
        <option value="68">68</option>
        <option value="70">70</option>
      </select>

      <label class="label">Размер зимней обуви</label>
      <select id="fWinterShoeSize">
        <option value="">— выберите —</option>
        <option value="36">36</option>
        <option value="37">37</option>
        <option value="38">38</option>
        <option value="39">39</option>
        <option value="40">40</option>
        <option value="41">41</option>
        <option value="42">42</option>
        <option value="43">43</option>
        <option value="44">44</option>
        <option value="45">45</option>
        <option value="46">46</option>
        <option value="47">47</option>
        <option value="48">48</option>
      </select>

      <button class="btn btn-gold" id="submitBtn" onclick="submitForm()">Отправить</button>
    </div>
  </div>

  <div id="screenSuccess">
    <div class="card">
      <div class="success-box">
        <div class="success-icon">✅</div>
        <div class="success-title">Данные отправлены</div>
        <div class="success-sub">Спасибо! Размеры передадутся в систему после проверки инструктором.</div>
      </div>
    </div>
  </div>
</div>

<script>
// Та же учётная запись Apps Script и то же действие submitSurvey, что и в
// anketa.html — специально НЕ отдельный backend-эндпоинт. submitSurvey()
// и approveSurvey() уже устроены так, что перезаписывают в «Сотрудники»
// только те поля, которые реально пришли непустыми (см. approveSurvey:
// `if (col >= 0 && val)`) — все остальные поля личного дела здесь просто
// не отправляются (undefined) и поэтому гарантированно не трогаются.
const CFG = {
  SHEET_URL: "https://script.google.com/macros/s/AKfycbwhdMV20k8US2BXUz1Xk2XCXE9MEwpHpQaadTF9xEfzbU1--dHL-Zuj06K2qXW-rFtKGw/exec",
};

let EMPLOYEES = [];
let selected = null;

async function loadEmployees() {
  try {
    const r = await fetch(`${CFG.SHEET_URL}?action=list`);
    const data = await r.json();
    if (Array.isArray(data)) {
      EMPLOYEES = data.map(e => ({ id:e.id, name:e.name, position:e.position, site:e.site }));
    }
  } catch(e) {
    console.error("Не удалось загрузить список сотрудников:", e);
  }
}

function initials(name) {
  return String(name||"").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase();
}

function renderEmpList(query) {
  const list = document.getElementById("empList");
  const q = String(query||"").trim().toLowerCase();
  if (!q) { list.innerHTML = ""; return; }

  const filtered = EMPLOYEES.filter(e => String(e.name||"").toLowerCase().includes(q)).slice(0, 8);

  if (filtered.length === 0) {
    list.innerHTML = `<div style="padding:12px;color:var(--gray);font-size:13px;text-align:center">
      Не найдено. Если вы новый человек — заполните <a href="anketa.html">полную анкету</a>.</div>`;
    return;
  }

  list.innerHTML = filtered.map(e => `
    <button type="button" class="emp-item" onclick='pickEmployee(${JSON.stringify(e)})'>
      <div class="emp-avatar">${initials(e.name)}</div>
      <div>
        <div class="emp-name">${e.name}</div>
        <div class="emp-pos">${e.position||"—"} · ${e.site||""}</div>
      </div>
    </button>
  `).join("");
}

function pickEmployee(emp) {
  selected = emp;
  document.getElementById("screenSearch").classList.remove("active");
  document.getElementById("screenForm").classList.add("active");

  document.getElementById("selectedBoxWrap").innerHTML = `
    <div class="selected-box">
      <div class="emp-avatar">${initials(selected.name)}</div>
      <div>
        <div class="name">${selected.name}</div>
        <div style="font-size:11px;color:var(--gray)">${selected.position||"—"}</div>
      </div>
      <span class="change" onclick="backToSearch()">изменить</span>
    </div>
  `;
}

function backToSearch() {
  selected = null;
  document.getElementById("screenForm").classList.remove("active");
  document.getElementById("screenSearch").classList.add("active");
}

async function submitForm() {
  if (!selected || !selected.id) { alert("Выберите себя из списка"); return; }

  const clothingSize = document.getElementById("fClothingSize").value;
  const shoeSize = document.getElementById("fShoeSize").value;
  const winterClothingSize = document.getElementById("fWinterClothingSize").value;
  const winterShoeSize = document.getElementById("fWinterShoeSize").value;
  if (!clothingSize && !shoeSize && !winterClothingSize && !winterShoeSize) { alert("Укажите хотя бы один размер"); return; }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "Отправка...";

  const body = {
    action: "submitSurvey",
    empId: selected.id,
    empName: selected.name,
    clothingSize,
    shoeSize,
    winterClothingSize,
    winterShoeSize,
  };

  try {
    const res = await fetch(CFG.SHEET_URL, { method:"POST", body: JSON.stringify(body) });
    const data = await res.json();
    if (data.ok) {
      document.getElementById("screenForm").classList.remove("active");
      document.getElementById("screenSuccess").classList.add("active");
    } else {
      alert("Ошибка: " + (data.error||"неизвестная"));
      btn.disabled = false;
      btn.textContent = "Отправить";
    }
  } catch(e) {
    alert("Ошибка сети. Проверьте интернет и попробуйте снова.");
    btn.disabled = false;
    btn.textContent = "Отправить";
  }
}

loadEmployees();
</script>
</body>
</html>
