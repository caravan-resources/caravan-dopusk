<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Панель БВР — Caravan Resources</title>
<style>
:root { --navy:#0B1A35; --navy2:#1B3B6F; --gold:#F4A52A; --red:#DC2626; --redbg:#FEF2F2; --green:#16A34A; --greenbg:#F0FDF4; --amber:#B45309; --amberbg:#FFFBEB; --gray:#64748B; --light:#F1F5F9; --border:#E2E8F0; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--light); color:var(--navy); font-size:14px; }
.top { background:var(--navy); color:#fff; padding:14px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.top h1 { font-size:18px; font-weight:800; } .top .sub { font-size:12px; color:rgba(255,255,255,.6); }
.wrap { max-width:1280px; margin:0 auto; padding:16px 20px 60px; }
.filters { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; background:#fff; padding:12px 14px; border-radius:12px; box-shadow:0 1px 6px rgba(0,0,0,.06); margin-bottom:14px; }
.filters label { display:block; font-size:11px; font-weight:700; color:var(--gray); margin-bottom:3px; }
input, select { padding:8px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; background:#fff; color:var(--navy); }
input:focus, select:focus { outline:none; border-color:var(--gold); }
.btn { padding:8px 14px; border:none; border-radius:8px; font-weight:800; font-size:13px; cursor:pointer; font-family:inherit; background:var(--light); color:var(--navy); }
.btn-gold { background:var(--gold); color:var(--navy); } .btn-dark { background:var(--navy); color:#fff; } .btn-red { background:var(--redbg); color:var(--red); border:1.5px solid var(--red); }
.btn:disabled { opacity:.5; cursor:default; }
.tabs { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
.tab { padding:9px 16px; border-radius:8px; background:#fff; border:1.5px solid var(--border); font-weight:800; cursor:pointer; font-size:13px; }
.tab.on { background:var(--navy); color:#fff; border-color:var(--navy); }
.card { background:#fff; border-radius:12px; padding:16px; margin-bottom:14px; box-shadow:0 1px 6px rgba(0,0,0,.06); }
.card h3 { font-size:14px; font-weight:800; margin-bottom:10px; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
.kpi { background:#fff; border-radius:12px; padding:12px 14px; box-shadow:0 1px 6px rgba(0,0,0,.06); }
.kpi b { display:block; font-size:22px; color:var(--navy); margin-top:2px; } .kpi span { font-size:11px; font-weight:700; color:var(--gray); } .kpi small { font-size:11px; color:var(--gray); }
table { border-collapse:collapse; width:100%; font-size:13px; }
th { text-align:left; font-size:11px; color:var(--gray); font-weight:800; padding:6px 8px; border-bottom:2px solid var(--border); white-space:nowrap; background:#fff; position:sticky; top:0; }
td { padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
td.r, th.r { text-align:right; font-variant-numeric:tabular-nums; }
.scroll { overflow:auto; max-height:70vh; }
tr.click { cursor:pointer; } tr.click:hover td { background:#F8FAFC; }
tr.miss td { background:var(--redbg); }
.tag { display:inline-block; font-size:11px; font-weight:800; padding:2px 7px; border-radius:6px; background:var(--amberbg); color:var(--amber); }
.tag.g { background:var(--greenbg); color:var(--green); } .tag.r { background:var(--redbg); color:var(--red); }
.bars .b { display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:13px; } .bars .b > span:first-child { width:200px; flex-shrink:0; }
.bars .fill { height:14px; background:var(--gold); border-radius:4px; } .bars .v { font-weight:800; min-width:70px; }
.grid { display:grid; gap:2px; font-size:10px; overflow:auto; }
.gc { height:20px; display:flex; align-items:center; justify-content:center; border-radius:3px; background:#E2E8F0; color:var(--gray); min-width:30px; }
.gc.ok { background:#BBF7D0; color:#14532D; font-weight:800; } .gc.h { background:transparent; color:var(--gray); font-weight:800; }
.gc.rl { justify-content:flex-start; padding-left:4px; font-weight:800; color:var(--navy); background:transparent; min-width:60px; }
.warnbox { background:var(--amberbg); border:1.5px solid var(--amber); color:var(--amber); padding:9px 12px; border-radius:8px; margin-bottom:10px; font-size:13px; font-weight:700; }
.note { font-size:12px; color:var(--gray); margin:6px 0; line-height:1.5; }
.detail td { background:#F8FAFC; } .detail .cols { display:flex; gap:24px; flex-wrap:wrap; }
.seed { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin:8px 0; } .seed input { width:100%; }
.chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; } .chip { padding:6px 12px; border:1.5px solid var(--border); border-radius:16px; font-weight:800; font-size:12px; cursor:pointer; background:#fff; } .chip.on { background:var(--navy); color:#fff; border-color:var(--navy); }
.pv td, .pv th { white-space:nowrap; font-size:12px; padding:5px 7px; }
#login { max-width:340px; margin:14vh auto; background:#fff; padding:28px; border-radius:14px; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,.1); }
#login input { width:100%; margin:14px 0 10px; padding:12px; }
.hidden { display:none !important; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div id="login">
  <h2 style="font-size:18px">Панель БВР</h2>
  <input type="password" id="pinInput" placeholder="PIN-код" onkeydown="if(event.key==='Enter')checkPin()">
  <button class="btn btn-gold" style="width:100%;padding:12px" onclick="checkPin()">Войти</button>
  <div id="loginErr" style="color:#DC2626;font-size:13px;margin-top:10px;display:none">Неверный PIN-код</div>
</div>

<div id="app" class="hidden">
  <div class="top"><div><h1>Панель БВР</h1><div class="sub">Журнал бурения по сменам</div></div><div style="margin-left:auto" class="sub" id="loadInfo"></div></div>
  <div class="wrap">
    <div class="filters">
      <div><label>С даты</label><input type="date" id="fFrom"></div>
      <div><label>По дату</label><input type="date" id="fTo"></div>
      <div><label>Станок</label><select id="fRig"></select></div>
      <div><label>Смена</label><select id="fSmena"><option value="">Обе</option><option value="1">Ночь (1)</option><option value="2">День (2)</option></select></div>
      <button class="btn" data-q="7">7 дней</button><button class="btn" data-q="14">14 дней</button><button class="btn" data-q="m">Месяц</button>
      <button class="btn btn-gold" id="btnLoad">Обновить</button>
    </div>
    <div class="tabs" id="tabs">
      <div class="tab on" data-t="sum">Сводка</div><div class="tab" data-t="shifts">Смены</div><div class="tab" data-t="tools">Инструмент</div><div class="tab" data-t="crew">Буровики</div><div class="tab" data-t="insp">Осмотры</div><div class="tab" data-t="kpi">KPI</div><div class="tab" data-t="journal">Журнал (выгрузка)</div>
    </div>
    <div id="msg"></div>
    <div id="v-sum"></div><div id="v-shifts" class="hidden"></div><div id="v-tools" class="hidden"></div><div id="v-crew" class="hidden"></div><div id="v-insp" class="hidden"></div><div id="v-kpi" class="hidden"></div><div id="v-journal" class="hidden"></div>
  </div>
</div>

<script>
const CFG = { PIN: "2508", SHEET_URL: "https://script.google.com/macros/s/AKfycbwhdMV20k8US2BXUz1Xk2XCXE9MEwpHpQaadTF9xEfzbU1--dHL-Zuj06K2qXW-rFtKGw/exec", SEED_KEY: "bvr.seed.v1", TZ: "Asia/Almaty" };
const TOOLS = { bit:"Коронка", hammer:"Пневмоударник", top_adapter:"Верхний адаптер", float_adapter:"Плавающий адаптер", rod:"Штанга" };
const TOOL_KEYS = ["bit","hammer","top_adapter","float_adapter","rod"];
// Колонки журнала: [название, индекс колонки модели, индекс колонки проходки] для каждого инструмента
const TOOL_COLS = { bit:[11,12], hammer:[13,14], top_adapter:[15,16], float_adapter:[17,18], rod:[19,20] };
const JOURNAL_HEAD = ["дата (дд.мм.гг)","Смена","Оператор","Блок","Диаметр скв","Пробурено скв, шт","Перебурено скв, шт","Обурено п/м","Перебур, п/м","Время бурения,мин","Производительность м/час","Замена коронки модель","Проходка по коронке.","Поставшик пневмоударника ","Проходка по пневмоударнику.","Замена верхнего адаптера ","Проходка адаптера","Замена Плавающего адаптера","Проходка плавающего адаптера","Замена штанги","Проходка штанги"];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const num = v => { const n = Number(String(v == null ? "" : v).replace(",", ".")); return isFinite(n) ? n : 0; };
const r1 = x => Math.round(x * 10) / 10, r2 = x => Math.round(x * 100) / 100;
const fmt = (n, d) => (Math.round(n * Math.pow(10, d || 0)) / Math.pow(10, d || 0)).toLocaleString("ru-RU", { maximumFractionDigits: d || 0 });
const hm = min => Math.floor(Math.round(min) / 60) + " ч " + (Math.round(min) % 60) + " мин";
const ddmmyyyy = iso => iso.slice(8, 10) + "." + iso.slice(5, 7) + "." + iso.slice(0, 4);
const ddmm = iso => iso.slice(8, 10) + "." + iso.slice(5, 7);
// Дата как целый серийный номер Excel: Date-объекты SheetJS получают дробную часть (время) из-за часового пояса
const xlDate = iso => Math.round((Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)) - Date.UTC(1899, 11, 30)) / 86400000);

// ═════════ чистая логика (без DOM) — проверяется отдельно ═════════
function addDays(iso, n) { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function daysBetween(from, to) { const out = []; for (let d = from; d <= to && out.length < 400; d = addDays(d, 1)) out.push(d); return out; }
function todayIso() { return new Intl.DateTimeFormat("en-CA", { timeZone: CFG.TZ }).format(new Date()); }

// «Козырев Андрей Петрович» -> «Козырев А» (так в журнале у большинства записей)
function shortName(n) {
  const p = String(n || "").trim().split(/\s+/).filter(Boolean);
  if (!p.length) return "";
  if (p.length === 1) return p[0];
  return p[0] + " " + p[1].replace(/\./g, "").charAt(0).toUpperCase();
}
const SWAP_GH = { "708": true };   // лист 708 в журнале: колонки G и H поменяны местами
const hasSwap = rig => !!SWAP_GH[String(rig || "").replace(/^\D+/, "")];
const headFor = rig => { const h = JOURNAL_HEAD.slice(); if (hasSwap(rig)) { const t = h[6]; h[6] = h[7]; h[7] = t; } return h; };
const cellsFor = (rig, cells) => { if (!hasSwap(rig)) return cells; const c = cells.slice(); const t = c[6]; c[6] = c[7]; c[7] = t; return c; };
const rigNo = id => String(id || "").replace(/^\D+/, "");   // DR702 -> 702 (имя листа журнала)

// Все сданные записи по одному станку на (дата, смена) сливаются в одну строку журнала.
function mergeShifts(list) {
  const m = {};
  list.forEach(s => { const k = s.date + "|" + s.smena; (m[k] = m[k] || []).push(s); });
  return m;
}

function sumDepth(holes, a, b) { let t = 0; for (let i = Math.max(a, 0); i <= b && i < holes.length; i++) t += num(holes[i].depth); return t; }

// Строки журнала по одному станку за период. seed = {bit,hammer,top_adapter,float_adapter,rod}.
// Замена: скважины ДО указанной (включительно) бурил старый инструмент, дальше — новый.
// Если скважина не указана — замена считается в начале смены. В колонке «Проходка» —
// наработка инструмента, стоящего на конец смены. Наработка снятого инструмента уходит в removals.
function buildJournal(rig, shifts, from, to, seed) {
  const byKey = mergeShifts(shifts.filter(s => s.equipmentId === rig));
  const st = {}; TOOL_KEYS.forEach(k => { st[k] = num(seed && seed[k]); });
  const rows = [], removals = [];
  daysBetween(from, to).forEach(date => {
    [1, 2].forEach(smena => {
      const grp = byKey[date + "|" + smena] || [];
      const cells = new Array(21).fill("");
      const row = { date: date, smena: smena, hasData: grp.length > 0, cells: cells, shifts: grp };
      cells[1] = smena;
      if (grp.length) {
        const holes = [], repl = [];
        grp.forEach(s => { (s.holes || []).forEach(h => holes.push(h)); (s.replacements || []).forEach(r => repl.push(Object.assign({}, r, { _s: s }))); });
        let hc = 0, rc = 0, mH = 0, mI = 0, min = 0;
        holes.forEach(h => { min += num(h.minutes); if (h.redrill) { rc++; mI += num(h.depth); } else { hc++; mH += num(h.depth); } });
        const diam = grp[0].diameter;
        const blocks = []; grp.forEach(s => (s.blockList || []).forEach(b => { if (blocks.indexOf(b) < 0) blocks.push(b); }));
        const ops = []; grp.forEach(s => { const n = shortName(s.empName); if (n && ops.indexOf(n) < 0) ops.push(n); });
        cells[2] = ops.join("/"); cells[3] = blocks.join("/"); cells[4] = diam || "";
        cells[5] = hc || ""; cells[6] = rc || ""; cells[7] = mH ? r2(mH) : ""; cells[8] = mI ? r2(mI) : ""; cells[9] = min ? Math.round(min) : "";
        cells[10] = min > 0 ? r1((mH + mI) * 60 / min) : "";
        TOOL_KEYS.forEach(tool => {
          const ev = repl.filter(r => r.tool === tool).map(r => {
            // позиция скважины замены в порядке ввода; не найдена — начало смены
            const p = r.atHole ? holes.findIndex(h => String(h.n) === String(r.atHole)) : -1;
            return { p: p, model: r.model || "" };
          }).sort((a, b) => a.p - b.p);
          let cur = st[tool], start = 0, lastModel = "";
          ev.forEach(e => {
            const seg = sumDepth(holes, start, e.p);
            removals.push({ rig: rig, tool: tool, date: date, smena: smena, life: r2(cur + seg), newModel: e.model, diameter: diam || "" });
            cur = 0; start = e.p + 1; lastModel = e.model || lastModel || "замена";
          });
          cur += sumDepth(holes, start, holes.length - 1);
          st[tool] = cur;
          if (ev.length) cells[TOOL_COLS[tool][0]] = lastModel;
        });
      }
      TOOL_KEYS.forEach(tool => { cells[TOOL_COLS[tool][1]] = r2(st[tool]); });
      rows.push(row);
    });
  });
  return { rows: rows, removals: removals, end: st };
}

function rowsToTsv(rows, c0, rig) {
  return rows.map(r => cellsFor(rig, r.cells).map((v, i) => {
    if (i === 0) return ddmmyyyy(r.date);
    return typeof v === "number" ? String(v).replace(".", ",") : String(v == null ? "" : v);
  }).slice(c0 || 0).join("\t")).join("\n");
}

// ═════════ состояние ═════════
let SHIFTS = [], EQUIP = [], RIGS = [], SEEDS = {}, curRig = "", curTab = "sum";
try { SEEDS = JSON.parse(localStorage.getItem(CFG.SEED_KEY) || "{}"); } catch (e) { SEEDS = {}; }
// Смены из загруженного журнала мастера (только для просмотра в сводке и списке смен; в выгрузку не идут)
let JROWS = [];
try { JROWS = JSON.parse(localStorage.getItem("bvr.jrows.v1") || "[]"); } catch (e) { JROWS = []; }
let JREPL = [];
try { JREPL = JSON.parse(localStorage.getItem("bvr.jrepl.v1") || "[]"); } catch (e) { JREPL = []; }
function saveJrows() { try { localStorage.setItem("bvr.jrepl.v1", JSON.stringify(JREPL)); } catch (e) {} saveJrows2(); }
function saveJrows2() { try { localStorage.setItem("bvr.jrows.v1", JSON.stringify(JROWS)); } catch (e) { msg("Журнал загружен, но не поместился в память браузера: после обновления страницы его нужно загрузить снова.", "err"); } }
// Смены от буровиков + строки журнала, которых нет среди смен от буровиков (за выбранный период)
function allShifts() { return mergeSys(SHIFTS, JROWS, $("fFrom").value, $("fTo").value); }
function mergeSys(sys, jrows, from, to) {
  const have = {};
  sys.forEach(s => { have[s.equipmentId + "|" + s.date + "|" + s.smena] = 1; });
  const jr = jrows.filter(r => r.date >= from && r.date <= to && !have[r.rig + "|" + r.date + "|" + r.smena]).map(r => ({
    shiftId: "j|" + r.rig + "|" + r.date + "|" + r.smena, source: "journal", equipmentId: r.rig, date: r.date, smena: r.smena,
    empName: r.op, empId: "", diameter: r.diam, blocks: r.block, blockList: [], holesCount: r.f, redrillCount: r.g,
    metersDrilled: r.h, metersRedrill: r.i, drillMinutes: r.j, downtimeMinutes: 0, holes: [], downtimes: [], replacements: [], note: "" }));
  return sys.concat(jr);
}
function saveSeeds() { try { localStorage.setItem(CFG.SEED_KEY, JSON.stringify(SEEDS)); } catch (e) {} }

function checkPin() {
  if ($("pinInput").value === CFG.PIN) { try { sessionStorage.setItem("bvr.pin", "1"); } catch (e) {} enter(); }
  else { $("loginErr").style.display = "block"; }
}
function enter() { $("login").classList.add("hidden"); $("app").classList.remove("hidden"); init(); }
try { if (sessionStorage.getItem("bvr.pin") === "1") enter(); } catch (e) {}

function setPeriod(q) {
  const t = todayIso();
  if (q === "m") { $("fFrom").value = t.slice(0, 8) + "01"; } else { $("fFrom").value = addDays(t, -(Number(q) - 1)); }
  $("fTo").value = t;
}
function msg(t, kind) { $("msg").innerHTML = t ? '<div class="warnbox"' + (kind === "err" ? ' style="background:#FEF2F2;border-color:#DC2626;color:#DC2626"' : "") + ">" + esc(t) + "</div>" : ""; }

async function init() {
  setPeriod("14");
  document.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { setPeriod(b.dataset.q); load(); });
  $("btnLoad").onclick = load;
  ["fRig", "fSmena"].forEach(id => $(id).onchange = render);
  document.querySelectorAll("#tabs .tab").forEach(t => t.onclick = () => {
    curTab = t.dataset.t; document.querySelectorAll("#tabs .tab").forEach(x => x.classList.toggle("on", x === t));
    ["sum", "shifts", "tools", "crew", "insp", "kpi", "journal"].forEach(k => $("v-" + k).classList.toggle("hidden", k !== curTab)); render();
  });
  try { EQUIP = await fetch(CFG.SHEET_URL + "?action=getEquipment").then(r => r.json()); } catch (e) { EQUIP = []; }
  await load();
}

async function load() {
  const from = $("fFrom").value, to = $("fTo").value;
  if (!from || !to || from > to) { msg("Проверьте даты периода", "err"); return; }
  $("btnLoad").disabled = true; $("btnLoad").textContent = "Загрузка...";
  try {
    const url = CFG.SHEET_URL + "?action=getDrillShifts&from=" + from + "&to=" + to;
    const data = await fetch(url).then(r => r.json());
    if (!Array.isArray(data)) throw new Error(data && data.error ? data.error : "ответ сервера не распознан");
    SHIFTS = data.map(s => Object.assign({}, s, { smena: Number(s.smena) }));
    msg("");
    $("loadInfo").textContent = "Обновлено " + new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit", timeZone: CFG.TZ }) + " · смен: " + SHIFTS.length;
  } catch (e) {
    msg("Не удалось загрузить смены: " + e.message + ". Если это первый запуск — проверьте, что патч бэкенда (bvr_backend_patch.gs) внесён и развёрнут новой версией.", "err");
    SHIFTS = [];
  }
  $("btnLoad").disabled = false; $("btnLoad").textContent = "Обновить";
  const rigsEquip = (EQUIP || []).filter(e => /Буров/i.test(e.type || "")).map(e => e.equipmentId);
  const rigsData = SHIFTS.map(s => s.equipmentId);
  RIGS = Array.from(new Set(rigsEquip.concat(rigsData))).sort((a, b) => rigNo(a).localeCompare(rigNo(b)));
  const cur = $("fRig").value;
  $("fRig").innerHTML = '<option value="">Все станки</option>' + RIGS.map(r => "<option>" + esc(r) + "</option>").join("");
  if (RIGS.indexOf(cur) >= 0) $("fRig").value = cur;
  render();
}

function filtered() {
  const rig = $("fRig").value, sm = $("fSmena").value;
  return allShifts().filter(s => (!rig || s.equipmentId === rig) && (!sm || String(s.smena) === sm));
}

// итоги по списку смен
function totals(list) {
  const t = { shifts: list.length, holes: 0, redrill: 0, mH: 0, mI: 0, min: 0, dt: 0 };
  list.forEach(s => { t.holes += num(s.holesCount); t.redrill += num(s.redrillCount); t.mH += num(s.metersDrilled); t.mI += num(s.metersRedrill); t.min += num(s.drillMinutes); t.dt += num(s.downtimeMinutes); });
  t.m = t.mH + t.mI; t.mph = t.min > 0 ? t.m * 60 / t.min : 0; t.pctRe = t.m > 0 ? t.mI / t.m * 100 : 0;
  return t;
}

// ═════════ KPI буровиков ═════════
// План — из книги KPI буровиков (лист «План машинистов», как в панели диспетчера). Факт — смены БВР (форма буровика + загруженный журнал).
// Учёт по суткам станка: суточный план станка (сумма по всем строкам плана станка за дату) и суточный факт станка (день + ночь)
// делятся поровну между машинистами, стоящими в плане на эти сутки. Сутки = дата начала смены (ночь 1 + день 2).
// KPI-LOGIC-BEGIN
const KP_KEY = "bvr.kpi.v1", KP_THR = "bvr.kpi.thr";
function kpYmd(v) {
  if (v instanceof Date && !isNaN(v)) return new Date(v.getTime() + 12 * 3600 * 1000).toISOString().slice(0, 10);
  if (typeof v === "number" && v > 20000 && v < 80000) return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
  if (typeof v === "string") {
    let m = v.match(/(\d{4})-(\d{2})-(\d{2})/); if (m) return m[1] + "-" + m[2] + "-" + m[3];
    m = v.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/); if (m) return m[3] + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[1]).slice(-2);
  }
  return null;
}
const kpNum = v => { const n = typeof v === "number" ? v : parseFloat(String(v == null ? "" : v).replace(",", ".")); return isFinite(n) ? n : 0; };
const kpStr = v => String(v == null ? "" : v).trim();
const kpName = v => kpStr(v).replace(/\s*\((уволен|уволена)\)\s*$/i, "");   // «Фамилия Имя (уволен)» в плане = тот же человек
const kpVac = fio => !fio || /^вакансия/i.test(fio);
const kpPk = n => { const p = String(n || "").trim().toLowerCase().replace(/\./g, " ").split(/\s+/).filter(Boolean); return p.length ? p[0] + "|" + (p[1] ? p[1][0] : "") : ""; };
const kpRig = r => String(r || "").replace(/\D+/g, "");   // DR702 / «702» -> 702

// plan: [[date, rig, vahta, shift, fio, hours, planM]]
function kpParsePlan(planAoa, setAoa) {
  const plan = [];
  (planAoa || []).slice(3).forEach(r => { const d = kpYmd(r[0]); if (!d) return; plan.push([d, kpStr(r[2]), kpStr(r[5]), kpStr(r[6]), kpName(r[7]), kpNum(r[8]), kpNum(r[11])]); });
  let month = setAoa && setAoa[3] ? kpYmd(setAoa[3][1]) : null; month = month ? month.slice(0, 7) : null;
  if (!month && plan.length) month = plan[0][0].slice(0, 7);
  return { month, plan };
}

// shifts: смены БВР {equipmentId,date,smena,empName,metersDrilled,metersRedrill}
function kpCompute(plan, shifts) {
  const days = {}; let pmin = "9999", pmax = "";
  plan.forEach(p => {
    const [d, rig, vh, sh, fio, hrs, pm] = p; if (d < pmin) pmin = d; if (d > pmax) pmax = d;
    const k = kpRig(rig) + "|" + d;
    const o = days[k] || (days[k] = { rig: kpRig(rig), rigName: rig, date: d, P: 0, F: 0, n: 0, own: {}, names: {}, people: [], vacPlan: 0 });
    o.P += pm;
    if (kpVac(fio)) { o.vacPlan += pm; return; }
    if ((pm > 0 || hrs > 0) && !o.people.some(x => x.fio === fio)) o.people.push({ fio, vahta: vh, shift: sh });
  });
  const noPlan = {}; let cut = "";
  (shifts || []).forEach(s => {
    const d = s.date; if (!d || d < pmin || d > pmax) return;
    const m = (+s.metersDrilled || 0) + (+s.metersRedrill || 0);
    const k = kpRig(s.equipmentId) + "|" + d, o = days[k];
    if (!o) { if (m > 0) { const q = noPlan[k] || (noPlan[k] = { rig: s.equipmentId, date: d, m: 0 }); q.m += m; if (d > cut) cut = d; } return; }
    o.F += m; o.n++; const pk = kpPk(s.empName); if (pk) { o.own[pk] = (o.own[pk] || 0) + m; o.names[pk] = s.empName; }
    if (m > 0 && d > cut) cut = d;
  });
  const W = {}, R = {}, control = { vacTotal: 0, noPeopleFact: 0, noPlanFact: Object.values(noPlan), noFact: [], offPlan: [] };
  Object.keys(days).sort().forEach(k => {
    const o = days[k], past = cut && o.date <= cut, N = o.people.length;
    const r = R[o.rig] || (R[o.rig] = { rig: o.rigName, plan: 0, planCut: 0, fact: 0 });
    r.plan += o.P; if (past) { r.planCut += o.P; r.fact += o.F; }
    if (past && o.P > 0 && !(o.F > 0)) control.noFact.push({ rig: o.rigName, date: o.date, plan: o.P });
    if (!N) { control.vacTotal += o.P; if (o.F > 0) control.noPeopleFact += o.F; return; }
    const pks = o.people.map(p => kpPk(p.fio));
    Object.keys(o.own).forEach(pk => { if (pks.indexOf(pk) < 0 && o.own[pk] > 0) control.offPlan.push({ rig: o.rigName, date: o.date, name: o.names[pk], m: o.own[pk] }); });
    o.people.forEach(p => {
      const w = W[p.fio] || (W[p.fio] = { fio: p.fio, vahta: p.vahta, shift: p.shift, rigs: {}, planM: 0, planCut: 0, fact: 0, own: 0, left: 0, daysLeft: 0, days: [] });
      const share = o.P / N, fs = past ? o.F / N : 0, own = o.own[kpPk(p.fio)] || 0;
      w.planM += share; w.rigs[o.rigName] = 1;
      if (past) { w.planCut += share; w.fact += fs; w.own += own; } else if (share > 0) { w.daysLeft++; w.left += share; }
      w.days.push({ date: o.date, rig: o.rigName, dayP: o.P, dayF: o.F, n: N, plan: share, fact: fs, own, past: !!past, partners: o.people.filter(x => x.fio !== p.fio).map(x => x.fio) });
    });
  });
  const rows = Object.values(W).map(w => {
    const rem = w.planM - w.fact;
    return Object.assign(w, { rigS: Object.keys(w.rigs).join(" "), diff: w.fact - w.planCut, pct: w.planCut > 0 ? w.fact / w.planCut * 100 : null, pctM: w.planM > 0 ? w.fact / w.planM * 100 : null, rem, need: w.daysLeft > 0 ? Math.max(0, rem) / w.daysLeft : null });
  }).sort((a, b) => a.fio.localeCompare(b.fio, "ru"));
  const rigs = Object.values(R).map(r => Object.assign(r, { diff: r.fact - r.planCut, pct: r.planCut > 0 ? r.fact / r.planCut * 100 : null })).sort((a, b) => kpRig(a.rig).localeCompare(kpRig(b.rig)));
  const tot = rows.reduce((t, w) => { t.planM += w.planM; t.planCut += w.planCut; t.fact += w.fact; return t; }, { planM: 0, planCut: 0, fact: 0 });
  return { cut, pmin, pmax, rows, rigs, tot, control };
}
// KPI-LOGIC-END

let KPLAN = null, KSH = null, KOPEN = "", KBUSY = false;
try { KPLAN = JSON.parse(localStorage.getItem(KP_KEY) || "null"); } catch (e) { KPLAN = null; }
function kpThr() { let t = { g: 100, y: 80 }; try { const s = JSON.parse(localStorage.getItem(KP_THR) || "null"); if (s && s.g > 0 && s.y > 0) t = s; } catch (e) {} return t; }
function kpBadge(p) {
  if (p === null || p === undefined) return '<span class="tag g" style="background:#E2E8F0;color:#64748B">нет плана</span>';
  const t = kpThr(), cls = p >= t.g ? "tag g" : p >= t.y ? "tag" : "tag r";
  return '<span class="' + cls + '">' + fmt(p, 1) + " %</span>";
}
const kpSign = v => (v >= 0 ? "+" : "") + fmt(v, 1);

function kpReadFile(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const wb = XLSX.read(new Uint8Array(fr.result), { type: "array", sheets: ["План машинистов", "Настройки"] });
      if (!wb.Sheets["План машинистов"]) throw new Error("в книге нет листа «План машинистов»");
      const aoa = n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null });
      const P = kpParsePlan(aoa("План машинистов"), wb.Sheets["Настройки"] ? aoa("Настройки") : []);
      if (!P.plan.length) throw new Error("лист «План машинистов» не содержит строк с датой");
      KPLAN = { month: P.month, file: file.name, at: Date.now(), plan: P.plan }; KSH = null;
      try { localStorage.setItem(KP_KEY, JSON.stringify(KPLAN)); } catch (e) { msg("План загружен, но не поместился в память браузера: после обновления страницы его нужно загрузить снова.", "err"); }
      if (curTab === "kpi") renderKpi();
    } catch (e) { msg("План KPI не прочитан: " + e.message, "err"); }
  };
  fr.readAsArrayBuffer(file);
}
async function kpFetch(force) {
  if (!KPLAN || KBUSY) return;
  if (!force && KSH && KSH.month === KPLAN.month && Date.now() - KSH.at < 180000) return;
  const ds = KPLAN.plan.map(p => p[0]).sort(), from = ds[0], to = ds[ds.length - 1];
  KBUSY = true; renderKpi();
  try {
    const data = await fetch(CFG.SHEET_URL + "?action=getDrillShifts&from=" + from + "&to=" + to).then(r => r.json());
    if (!Array.isArray(data)) throw new Error(data && data.error ? data.error : "ответ сервера не распознан");
    KSH = { month: KPLAN.month, at: Date.now(), list: data.map(s => Object.assign({}, s, { smena: Number(s.smena) })) };
    msg("");
  } catch (e) { msg("Не удалось загрузить смены для KPI: " + e.message, "err"); KSH = KSH || { month: KPLAN.month, at: 0, list: [] }; }
  KBUSY = false; if (curTab === "kpi") renderKpi();
}
function kpFacts() {
  const ds = KPLAN.plan.map(p => p[0]).sort();
  return mergeSys(KSH ? KSH.list : [], JROWS, ds[0], ds[ds.length - 1]);
}
function kpClear() {
  if (!confirm("Удалить загруженный план KPI из браузера?")) return;
  KPLAN = null; KSH = null; KOPEN = ""; try { localStorage.removeItem(KP_KEY); } catch (e) {}
  renderKpi();
}
function kpSetThr() {
  const g = +$("kpG").value, y = +$("kpY").value;
  if (g > 0 && y > 0) { try { localStorage.setItem(KP_THR, JSON.stringify({ g, y })); } catch (e) {} }
  renderKpi();
}
function kpExport() {
  if (!KPLAN || typeof XLSX === "undefined") return;
  const C = kpCompute(KPLAN.plan, kpFacts()), wb = XLSX.utils.book_new();
  const a = [["ФИО", "Группа", "Смена", "Станок", "План на срез, п.м.", "Факт, п.м.", "Отклонение, п.м.", "Факт/план, %", "Личные метры, п.м.", "План месяца, п.м.", "% месяца", "Осталось до плана, п.м.", "Суток осталось", "Нужно в сутки, п.м."]]
    .concat(C.rows.map(w => [w.fio, w.vahta, w.shift, w.rigS, r1(w.planCut), r1(w.fact), r1(w.diff), w.pct === null ? "" : r1(w.pct), r1(w.own), r1(w.planM), w.pctM === null ? "" : r1(w.pctM), w.planM > 0 ? r1(Math.max(0, w.rem)) : "", w.daysLeft || "", w.need === null ? "" : r1(w.need)]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(a), "Буровики");
  const d = [["ФИО", "Дата", "Станок", "План станка за сутки, п.м.", "Факт станка за сутки, п.м.", "Машинистов в сутках", "План доли, п.м.", "Факт доли, п.м.", "Факт/план, %", "Личные метры, п.м.", "Напарник"]];
  C.rows.forEach(w => w.days.slice().sort((x, y) => x.date < y.date ? -1 : 1).forEach(x => d.push([w.fio, ddmmyyyy(x.date), x.rig, r1(x.dayP), x.past ? r1(x.dayF) : "", x.n, r1(x.plan), x.past ? r1(x.fact) : "", x.past && x.plan > 0 ? r1(x.fact / x.plan * 100) : "", x.past ? r1(x.own) : "", x.partners.join(", ")])));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(d), "Сутки");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Станок", "План на срез, п.м.", "Факт, п.м.", "Отклонение, п.м.", "Факт/план, %", "План месяца, п.м."]].concat(C.rigs.map(r => [r.rig, r1(r.planCut), r1(r.fact), r1(r.diff), r.pct === null ? "" : r1(r.pct), r1(r.plan)]))), "Станки");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Месяц", KPLAN.month], ["Срез (последняя дата факта)", C.cut], ["Книга плана", KPLAN.file], ["Правило", "План и факт станка за сутки делятся поровну между машинистами суток"]]), "Параметры");
  XLSX.writeFile(wb, "KPI_бурение_" + KPLAN.month + ".xlsx");
}

  const up = '<input type="file" id="kpFile" accept=".xlsx,.xlsm,.xls" style="display:none"><button class="btn btn-gold" onclick="$(\'kpFile\').click()">' + (KPLAN ? "Загрузить другой план" : "Загрузить план KPI") + "</button>";
  if (!KPLAN) {
    host.innerHTML = '<div class="card"><h3>KPI буровиков</h3><div class="note">Загрузите ту же книгу KPI буровиков, что и в панели диспетчера (нужен лист «План машинистов», для месяца — «Настройки»). План хранится в этом браузере. Факт берётся из смен, которые сдают буровики, и из загруженного журнала.</div>' + up + "</div>";
    $("kpFile").onchange = e => { if (e.target.files[0]) kpReadFile(e.target.files[0]); };

  const C = kpCompute(KPLAN.plan, kpFacts()), T = C.tot, thr = kpThr(), p = T.planCut > 0 ? T.fact / T.planCut * 100 : null;

    '<span class="note" style="margin-left:auto">Цвет: зелёный от <input id="kpG" type="number" value="' + thr.g + '" style="width:56px" onchange="kpSetThr()"> %, жёлтый от <input id="kpY" type="number" value="' + thr.y + '" style="width:56px" onchange="kpSetThr()"> %</span></div>' +
    '<div class="note">План «' + esc(KPLAN.file) + '», месяц ' + esc(KPLAN.month) + '. Учёт по суткам станка: план и факт станка за сутки (день + ночь) делятся поровну между машинистами суток. Факт — обурено + перебур. Сутки среза входят в план целиком.</div></div>';
  h += '<div class="kpis">' +
    '<div class="kpi"><span>Срез: последняя дата факта</span><b>' + (C.cut ? ddmmyyyy(C.cut) : "—") + "</b></div>" +
    '<div class="kpi"><span>План на срез, п.м.</span><b>' + fmt(T.planCut, 1) + "</b></div>" +

    '<div class="kpi"><span>План месяца, п.м.</span><b>' + fmt(T.planM, 1) + "</b><small>осталось " + fmt(Math.max(0, T.planM - T.fact), 1) + "</small></div></div>";
  if (!C.cut) h += '<div class="warnbox">В загруженных сменах нет метров за даты плана — факт пока нулевой.</div>';

    C.rigs.map(r => "<tr><td><b>" + esc(r.rig) + '</b></td><td class="r">' + fmt(r.planCut, 1) + '</td><td class="r">' + fmt(r.fact, 1) + '</td><td class="r">' + kpSign(r.diff) + "</td><td>" + kpBadge(r.pct) + '</td><td class="r">' + fmt(r.plan, 1) + "</td></tr>").join("") + "</table></div>";
  const c = C.control, ctl = [];
  if (c.vacTotal > 0) ctl.push("План на сутки без машинистов (одни вакансии), не распределён: " + fmt(c.vacTotal, 1) + " п.м.");
  if (c.noPeopleFact > 0) ctl.push("Факт на сутках, где в плане нет машинистов: " + fmt(c.noPeopleFact, 1) + " п.м.");
  if (c.noPlanFact.length) ctl.push("Факт на станках и датах без плана: " + c.noPlanFact.slice(0, 12).map(x => esc(x.rig) + " " + ddmm(x.date) + " — " + fmt(x.m, 1) + " м").join("; ") + (c.noPlanFact.length > 12 ? " и ещё " + (c.noPlanFact.length - 12) : ""));
  if (c.offPlan.length) ctl.push("Работали не по плану (метры идут в факт суток, но не личным): " + c.offPlan.slice(0, 12).map(x => esc(x.name) + " · " + esc(x.rig) + " " + ddmm(x.date) + " — " + fmt(x.m, 1) + " м").join("; ") + (c.offPlan.length > 12 ? " и ещё " + (c.offPlan.length - 12) : ""));
  if (c.noFact.length) ctl.push("Сутки с планом до среза, но без факта (смены не сданы или станок стоял): " + c.noFact.length + " — " + c.noFact.slice(0, 15).map(x => esc(x.rig) + " " + ddmm(x.date)).join(", ") + (c.noFact.length > 15 ? " …" : ""));
  h += '<div class="card"><h3>Контроль данных</h3>' + (ctl.length ? ctl.map(t => '<div class="note">• ' + t + "</div>").join("") : '<div class="note">Расхождений нет</div>') + "</div>";
  host.innerHTML = h;
  $("kpFile").onchange = e => { if (e.target.files[0]) kpReadFile(e.target.files[0]); };
  host.querySelectorAll("tr.click").forEach(tr => tr.onclick = () => { KOPEN = KOPEN === tr.dataset.fio ? "" : tr.dataset.fio; renderKpi(); });
}

function render() {
  if (curTab === "sum") renderSum(); else if (curTab === "shifts") renderShifts(); else if (curTab === "tools") renderTools(); else if (curTab === "crew") renderCrew(); else if (curTab === "insp") renderInsp(); else if (curTab === "kpi") renderKpi(); else { renderJournal(); appendArchive(); }
}

// ═════════ Сводка ═════════
function renderSum() {
  const list = filtered(), t = totals(list);
  let h = '<div class="kpis">' +
    '<div class="kpi"><span>Смен в периоде</span><b>' + t.shifts + '</b></div>' +
    '<div class="kpi"><span>Обурено, п/м</span><b>' + fmt(t.mH, 1) + '</b><small>' + fmt(t.holes) + ' скв.</small></div>' +
    '<div class="kpi"><span>Перебур, п/м</span><b>' + fmt(t.mI, 1) + '</b><small>' + fmt(t.redrill) + ' скв. · ' + fmt(t.pctRe, 1) + ' % метров</small></div>' +
    '<div class="kpi"><span>Время бурения</span><b>' + hm(t.min) + '</b></div>' +
    '<div class="kpi"><span>Производительность</span><b>' + (t.min ? fmt(t.mph, 1) : "—") + '</b><small>м/час</small></div>' +
    '<div class="kpi"><span>Простои</span><b>' + hm(t.dt) + '</b></div></div>';

  // по станкам
  const byRig = {}; list.forEach(s => { (byRig[s.equipmentId] = byRig[s.equipmentId] || []).push(s); });
  const rigs = Object.keys(byRig).sort((a, b) => rigNo(a).localeCompare(rigNo(b)));
  h += '<div class="card"><h3>По станкам</h3><div class="scroll"><table><tr><th>Станок</th><th class="r">Смен</th><th class="r">Скв.</th><th class="r">Обурено, м</th><th class="r">Перебур, скв.</th><th class="r">Перебур, м</th><th class="r">Бурение</th><th class="r">м/час</th><th class="r">Простой</th></tr>';
  h += rigs.length ? rigs.map(r => { const x = totals(byRig[r]); return "<tr><td><b>" + esc(r) + "</b></td><td class='r'>" + x.shifts + "</td><td class='r'>" + fmt(x.holes) + "</td><td class='r'>" + fmt(x.mH, 1) + "</td><td class='r'>" + fmt(x.redrill) + "</td><td class='r'>" + fmt(x.mI, 1) + "</td><td class='r'>" + hm(x.min) + "</td><td class='r'>" + (x.min ? fmt(x.mph, 1) : "—") + "</td><td class='r'>" + hm(x.dt) + "</td></tr>"; }).join("") : '<tr><td colspan="9" style="color:#64748B">За период смен нет</td></tr>';
  h += "</table></div></div>";

  // простои по причинам
  const byReason = {}; let dtAll = 0;
  list.forEach(s => (s.downtimes || []).forEach(d => { byReason[d.reason || "Без причины"] = (byReason[d.reason || "Без причины"] || 0) + num(d.minutes); dtAll += num(d.minutes); }));
  const rs = Object.keys(byReason).sort((a, b) => byReason[b] - byReason[a]);
  h += '<div class="card"><h3>Простои по причинам</h3><div class="bars">' + (rs.length ? rs.map(k => '<div class="b"><span>' + esc(k) + '</span><div style="flex:1"><div class="fill" style="width:' + Math.max(2, byReason[k] / byReason[rs[0]] * 100) + '%"></div></div><span class="v">' + hm(byReason[k]) + '</span></div>').join("") : '<div class="note">Простоев не записано</div>') + '</div></div>';

  // сетка сдачи смен: кто не сдал
  const from = $("fFrom").value, to = $("fTo").value, days = daysBetween(from, to);
  if (days.length && days.length <= 35) {
    const gridRigs = $("fRig").value ? [$("fRig").value] : RIGS;
    const idx = {}; allShifts().forEach(s => { idx[s.equipmentId + "|" + s.date + "|" + s.smena] = (idx[s.equipmentId + "|" + s.date + "|" + s.smena] || 0) + num(s.metersDrilled) + num(s.metersRedrill); });
    const has = {}; allShifts().forEach(s => { has[s.equipmentId + "|" + s.date + "|" + s.smena] = 1; });
    h += '<div class="card"><h3>Сдача смен (Н — ночь, Д — день)</h3><div class="note">Серая клетка — смена не сдана (станок мог стоять). Зелёная — сдана, в клетке метры.</div><div style="overflow:auto"><div class="grid" style="grid-template-columns:70px repeat(' + (days.length * 2) + ',34px)">';
    h += '<div class="gc h"></div>' + days.map(d => '<div class="gc h" style="grid-column:span 2">' + ddmm(d) + '</div>').join("");
    h += '<div class="gc h"></div>' + days.map(() => '<div class="gc h">Н</div><div class="gc h">Д</div>').join("");
    gridRigs.forEach(r => { h += '<div class="gc rl">' + esc(r) + "</div>" + days.map(d => [1, 2].map(sm => { const k = r + "|" + d + "|" + sm; return has[k] ? '<div class="gc ok">' + Math.round(idx[k]) + "</div>" : '<div class="gc">·</div>'; }).join("")).join(""); });
    h += "</div></div></div>";
  }
  $("v-sum").innerHTML = h;
}

// ═════════ Смены ═════════
let openShift = "", delArm = "";
function renderShifts() {

  let h = '<div class="card"><div class="scroll"><table><tr><th>Дата</th><th>Смена</th><th>Станок</th><th>Оператор</th><th>Блок</th><th class="r">Скв.</th><th class="r">Перебур</th><th class="r">Метры</th><th class="r">Бурение</th><th class="r">м/час</th><th class="r">Простой</th><th>Замены</th></tr>';
  if (!list.length) h += '<tr><td colspan="12" style="color:#64748B">Смен нет</td></tr>';
  list.forEach(s => {
    const m = num(s.metersDrilled) + num(s.metersRedrill), mph = num(s.drillMinutes) > 0 ? m * 60 / num(s.drillMinutes) : 0;
    h += '<tr' + (s.source === "journal" ? "" : ' class="click"') + ' data-id="' + esc(s.shiftId) + '"><td>' + ddmmyyyy(s.date) + '</td><td>' + (s.smena === 1 ? "Ночь" : "День") + '</td><td><b>' + esc(s.equipmentId) + '</b>' + (s.source === "journal" ? ' <span class="tag g">журнал</span>' : "") + '</td><td>' + esc(s.empName) + '</td><td>' + esc(s.blocks) + '</td><td class="r">' + fmt(num(s.holesCount)) + '</td><td class="r">' + (num(s.redrillCount) ? '<span class="tag">' + fmt(num(s.redrillCount)) + " / " + fmt(num(s.metersRedrill), 1) + "</span>" : "") + '</td><td class="r"><b>' + fmt(m, 1) + '</b></td><td class="r">' + hm(num(s.drillMinutes)) + '</td><td class="r">' + (num(s.drillMinutes) ? fmt(mph, 1) : "—") + '</td><td class="r">' + (num(s.downtimeMinutes) ? hm(num(s.downtimeMinutes)) : "") + '</td><td>' + (s.replacements || []).map(r => esc(TOOLS[r.tool] || r.tool)).join(", ") + "</td></tr>";
    if (openShift === s.shiftId) {
      h += '<tr class="detail"><td colspan="12"><div class="cols"><div><b>Скважины</b><table class="pv"><tr><th>№</th><th class="r">м</th><th class="r">мин</th><th>Прим.</th></tr>' +
        (s.holes || []).map(x => "<tr><td>" + esc(x.n) + (x.redrill ? ' <span class="tag">перебур' + (x.replacesHole ? " вм. №" + esc(x.replacesHole) : "") + "</span>" : "") + '</td><td class="r">' + fmt(num(x.depth), 2) + '</td><td class="r">' + fmt(num(x.minutes)) + "</td><td>" + esc(x.note || "") + "</td></tr>").join("") + "</table></div>" +
        '<div><b>Простои</b><br>' + ((s.downtimes || []).length ? (s.downtimes || []).map(d => esc(d.reason) + ": " + fmt(num(d.minutes)) + " мин" + (d.from && d.to ? " (" + esc(d.from) + "–" + esc(d.to) + ")" : "") + (d.note ? " — " + esc(d.note) : "")).join("<br>") : "нет") +
        '<br><br><b>Замены</b><br>' + ((s.replacements || []).length ? (s.replacements || []).map(r => esc(TOOLS[r.tool] || r.tool) + (r.model ? " " + esc(r.model) : "") + (r.atHole ? ", скв. №" + esc(r.atHole) : ", начало смены")).join("<br>") : "нет") +
        (s.note ? "<br><br><b>Примечание</b><br>" + esc(s.note) : "") + '<div class="note">Сдана: ' + esc(s.createdAt || "") + (s.updatedAt ? " · исправлена: " + esc(s.updatedAt) : "") + '</div></div></div>' +
        '<div style="margin-top:10px;display:flex;gap:8px"><a class="btn btn-dark" style="text-decoration:none" href="bvr-form.html?eq=' + encodeURIComponent(s.equipmentId) + "&shift=" + encodeURIComponent(s.shiftId) + '">Исправить</a>' +
        '<button class="btn btn-red" data-del="' + esc(s.shiftId) + '">' + (delArm === s.shiftId ? "Нажмите ещё раз: удалить смену (останется в архиве)" : "Удалить") + "</button></div></td></tr>";
    }
  });
  h += "</table></div></div>";
  $("v-shifts").innerHTML = h;
  $("v-shifts").querySelectorAll("tr.click").forEach(tr => tr.onclick = () => { openShift = openShift === tr.dataset.id ? "" : tr.dataset.id; delArm = ""; renderShifts(); });
  $("v-shifts").querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (delArm !== b.dataset.del) { delArm = b.dataset.del; renderShifts(); return; }
    b.disabled = true;
    try {
      const r = await fetch(CFG.SHEET_URL, { method: "POST", body: JSON.stringify({ action: "deleteDrillShift", shiftId: b.dataset.del }) }).then(x => x.json());
      if (!r.ok) throw new Error(r.error || "ошибка");
      openShift = ""; delArm = ""; await load();
    } catch (e) { msg("Не удалось удалить: " + e.message, "err"); b.disabled = false; }
  });
}

// ═════════ Инструмент ═════════
function renderTools() {
  const rigs = $("fRig").value ? [$("fRig").value] : RIGS.filter(r => SHIFTS.some(s => s.equipmentId === r) || SEEDS[r]);
  const from = $("fFrom").value, to = $("fTo").value;
  let rem = [], h = "";
  rigs.forEach(r => { rem = rem.concat(buildJournal(r, SHIFTS, from, to, SEEDS[r]).removals); });
  // Замены из загруженного журнала; если за ту же дату/смену/инструмент есть запись от буровика — берётся она
  const sysKey = {}; rem.forEach(x => { sysKey[x.rig + "|" + x.date + "|" + x.smena + "|" + x.tool] = 1; });
  JREPL.filter(x => x.date >= from && x.date <= to && (!$("fRig").value || x.rig === $("fRig").value) && !sysKey[x.rig + "|" + x.date + "|" + x.smena + "|" + x.tool])

  h += '<div class="card"><h3>Замены инструмента за период</h3><div class="note">Наработка снятого инструмента = счётчик на момент замены (из журнала или начального значения) + метры до скважины замены. Для строк «журнал» в колонке наработки стоит значение счётчика из вашего журнала в строке замены. Без начального счётчика наработка считается только с начала периода.</div><div class="scroll"><table><tr><th>Дата</th><th>Смена</th><th>Станок</th><th>Инструмент</th><th class="r">Наработка снятого, м</th><th>Поставлен</th></tr>';
  h += rem.length ? rem.sort((a, b) => a.date === b.date ? a.smena - b.smena : (a.date < b.date ? -1 : 1)).map(x => "<tr><td>" + ddmmyyyy(x.date) + "</td><td>" + (x.smena === 1 ? "Ночь" : x.smena === 2 ? "День" : "—") + "</td><td><b>" + esc(x.rig) + "</b>" + (x.src === "journal" ? ' <span class="tag g">журнал</span>' : "") + "</td><td>" + esc(TOOLS[x.tool]) + '</td><td class="r"><b>' + fmt(x.life, 1) + "</b></td><td>" + esc(x.newModel) + "</td></tr>").join("") : '<tr><td colspan="6" style="color:#64748B">Замен за период нет</td></tr>';
  h += "</table></div></div>";
  h += '<div class="card"><h3>Наработка на конец периода</h3><div class="scroll"><table><tr><th>Станок</th>' + TOOL_KEYS.map(k => '<th class="r">' + esc(TOOLS[k]) + ", м</th>").join("") + "<th>Журнал учтён по</th></tr>";
  rigs.forEach(r => { const e = buildJournal(r, SHIFTS, from, to, SEEDS[r]).end, sd = SEEDS[r]; h += "<tr><td><b>" + esc(r) + "</b></td>" + TOOL_KEYS.map(k => '<td class="r">' + fmt(e[k], 1) + "</td>").join("") + "<td>" + (sd && sd.asOf ? ddmmyyyy(sd.asOf) : '<span class="tag r">не задан</span>') + "</td></tr>"; });
  h += "</table></div></div>";
  $("v-tools").innerHTML = h;
}

// ═════════ Журнал (выгрузка) ═════════
let jRig = "";
function renderJournal() {
  const from = $("fFrom").value, to = $("fTo").value;
  const rigs = RIGS.filter(r => SHIFTS.some(s => s.equipmentId === r));
  if (!rigs.length) {
    // Смен ещё нет (первый запуск) — загрузка журнала всё равно нужна: счётчики берутся заранее.
    const rg = Object.keys(SEEDS).filter(r => SEEDS[r] && (SEEDS[r].asOf || TOOL_KEYS.some(k => SEEDS[r][k]))).sort((a, b) => rigNo(a).localeCompare(rigNo(b)));
    const tbl = rg.length ? '<div class="scroll" style="margin-top:10px"><table><tr><th>Станок</th>' + TOOL_KEYS.map(k => '<th class="r">' + esc(TOOLS[k]) + ', м</th>').join("") + '<th>Журнал заполнен по</th></tr>' +
      rg.map(r => "<tr><td><b>" + esc(r) + "</b></td>" + TOOL_KEYS.map(k => '<td class="r">' + (SEEDS[r][k] != null ? fmt(SEEDS[r][k], 2) : "—") + "</td>").join("") + "<td>" + (SEEDS[r].asOf ? ddmmyyyy(SEEDS[r].asOf) : "—") + "</td></tr>").join("") + "</table></div>" : "";
    $("v-journal").innerHTML = '<div class="card"><h3>Журнал (выгрузка)</h3><div class="note">За выбранный период нет сданных смен, поэтому строк для выгрузки пока нет — они появятся, когда буровики сдадут смены. Загрузите ваш журнал сейчас: панель запомнит счётчики проходки по инструменту.</div>' +
      '<div style="margin:10px 0"><label class="btn btn-dark" style="cursor:pointer">Загрузить журнал (.xlsx) — взять счётчики<input type="file" id="fJournal" accept=".xlsx,.xlsm" class="hidden"></label></div>' +
      (rg.length ? '<div class="note"><b>Счётчики загружены и сохранены в этом браузере:</b></div>' + tbl : '<div class="note">Счётчики пока не загружены.</div>') + "</div>";
    $("fJournal").onchange = e => { if (e.target.files[0]) readJournal(e.target.files[0]); };
    return;
  }
  if (rigs.indexOf(jRig) < 0) jRig = rigs[0];
  const sd = SEEDS[jRig] || {};
  const J = buildJournal(jRig, SHIFTS, from, to, sd);
  let h = '<div class="card"><h3>Строки журнала по станку</h3><div class="chips">' + rigs.map(r => '<div class="chip' + (r === jRig ? " on" : "") + '" data-rig="' + esc(r) + '">' + esc(r) + "</div>").join("") + "</div>";
  if (!sd.asOf && !TOOL_KEYS.some(k => sd[k])) h += '<div class="warnbox">Начальные счётчики проходки по ' + esc(jRig) + ' не заданы — проходка по инструменту считается с нуля. Загрузите ваш журнал (кнопка ниже) или впишите значения.</div>';
  else if (sd.asOf && from <= sd.asOf) h += '<div class="warnbox">Период начинается не позже даты, по которую журнал уже заполнен (' + ddmmyyyy(sd.asOf) + '). Метры этих дней учтены в счётчиках журнала и посчитаются повторно. Начните период с ' + ddmmyyyy(addDays(sd.asOf, 1)) + '.</div>';
  const missing = J.rows.filter(r => !r.hasData).length;
  if (missing) h += '<div class="note">Строк без данных: ' + missing + ' (смена не сдана или станок стоял) — в них только дата и смена, счётчики сохранены.</div>';
  h += '<div class="note"><b>Счётчики на начало периода</b> (значения журнала по ' + esc(jRig) + ', последняя строка перед периодом):</div><div class="seed">' +
    TOOL_KEYS.map(k => '<div><label style="font-size:11px;font-weight:700;color:#64748B">' + esc(TOOLS[k]) + ', м</label><input data-seed="' + k + '" value="' + (sd[k] != null ? esc(String(sd[k]).replace(".", ",")) : "") + '" inputmode="decimal"></div>').join("") +
    '<div><label style="font-size:11px;font-weight:700;color:#64748B">Журнал заполнен по дату</label><input type="date" data-seed="asOf" value="' + esc(sd.asOf || "") + '"></div></div>';
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0"><label class="btn btn-dark" style="cursor:pointer">Загрузить журнал (.xlsx) — взять счётчики<input type="file" id="fJournal" accept=".xlsx,.xlsm" class="hidden"></label>' +
    '<button class="btn btn-gold" id="btnCopyAll">Копировать A–U</button><button class="btn btn-gold" id="btnCopyData">Копировать F–U (без даты, оператора, блока)</button><button class="btn btn-dark" id="btnXlsx">Скачать Excel (все станки)</button></div>';
  h += '<div class="note">Копирование — табличный текст: вставьте в лист ' + esc(rigNo(jRig)) + ' вашего журнала в первую строку периода. Строки идут по порядку «дата, смена 1, смена 2» (как в журнале). Числа с запятой, K — значение (в журнале у вас формула).<br>Проходка инструмента считается в этом же порядке.</div>';
  h += '<div class="scroll"><table class="pv"><tr>' + headFor(jRig).map(x => "<th>" + esc(x) + "</th>").join("") + "</tr>" +
    J.rows.map(r => "<tr" + (r.hasData ? "" : ' class="miss"') + ">" + cellsFor(jRig, r.cells).map((v, i) => "<td" + (typeof v === "number" ? ' class="r"' : "") + ">" + (i === 0 ? ddmmyyyy(r.date) : esc(v)) + "</td>").join("") + "</tr>").join("") + "</table></div></div>";
  $("v-journal").innerHTML = h;
  document.querySelectorAll("#v-journal .chip").forEach(c => c.onclick = () => { jRig = c.dataset.rig; renderJournal(); });
  document.querySelectorAll("#v-journal [data-seed]").forEach(i => i.onchange = () => {
    const s = SEEDS[jRig] || (SEEDS[jRig] = {}); const k = i.dataset.seed;
    if (k === "asOf") s.asOf = i.value; else s[k] = num(i.value);
    saveSeeds(); renderJournal();
  });
  $("fJournal").onchange = e => { if (e.target.files[0]) readJournal(e.target.files[0]); };
  $("btnCopyAll").onclick = () => copyText(rowsToTsv(J.rows, 0, jRig), "Скопировано: " + J.rows.length + " строк, колонки A–U");
  $("btnCopyData").onclick = () => copyText(rowsToTsv(J.rows, 5, jRig), "Скопировано: " + J.rows.length + " строк, колонки F–U");
  $("btnXlsx").onclick = () => exportXlsx(rigs);
}

// ═════════ Буровики: состав, выработка по людям, осмотры ═════════
// Состав и статусы — из того же листа «Смены», что и в панели горного мастера (master.html); там ничего не меняется.
let CREW = null, CSTATS = null, crewLoading = false, dismissArm = "";
const personKey = n => { const p = String(n || "").trim().toLowerCase().replace(/\./g, " ").split(/\s+/).filter(Boolean); return p.length ? p[0] + "|" + (p[1] ? p[1][0] : "") : ""; };
function rosterGone(r) {
  const st = String(r.status || "").trim().toLowerCase();
  if (st === "уволен") return true;

// ═════════ Осмотры буровых станков (чек-листы целиком) ═════════
// Данные: тот же лист «Чек-листы-Записи», что и в панели мастера; в панели БВР отбираются станки DR*.
let INSP = null, INSP_KEY = "", inspOpen = "", inspBusy = false; const inspFull = {};
const chkRu = st => st === "ok" ? "Исправно" : st === "defect" ? "Неисправно" : String(st == null ? "" : st);
const atDate = at => ddmmyyyy(String(at).slice(0, 10)), atTime = at => String(at).slice(11, 16);
async function fetchInsp(from, to, rig, light, recordId) {
  const u = CFG.SHEET_URL + "?action=getDrillChecklists&from=" + from + "&to=" + to + (rig ? "&equipmentId=" + encodeURIComponent(rig) : "") + (light ? "&light=1" : "") + (recordId ? "&recordId=" + encodeURIComponent(recordId) : "");
  const d = await fetch(u).then(r => r.json());
  if (!d || !d.ok) throw new Error(d && d.error ? d.error : "бэкенд не обновлён (нет действия getDrillChecklists)");
  return d.records || [];
}
async function renderInsp() {
  const from = $("fFrom").value, to = $("fTo").value, rig = $("fRig").value, key = from + "|" + to + "|" + rig;
  if (INSP_KEY !== key || !INSP) {
    if (inspBusy) return; inspBusy = true;
    $("v-insp").innerHTML = '<div class="card"><div class="note">Загрузка осмотров буровых за период (до 20 секунд)...</div></div>';
    try { INSP = await fetchInsp(from, to, rig, true); INSP_KEY = key; }
    catch (e) { inspBusy = false; INSP = null; $("v-insp").innerHTML = '<div class="card"><div class="warnbox">Не удалось загрузить осмотры: ' + esc(e.message) + '</div><button class="btn" id="btnInspRetry">Повторить</button></div>'; $("btnInspRetry").onclick = renderInsp; return; }
    inspBusy = false;
  }
  const list = INSP, bad = list.filter(x => x.defects > 0).length;
  let h = '<div class="card"><h3>Осмотры буровых станков</h3><div class="note">Период и станок берутся из фильтров вверху. Нажмите на осмотр, чтобы открыть его целиком. Осмотров: <b>' + list.length + "</b>, с неисправностями: <b>" + bad + "</b>.</div>" +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin:10px 0"><div><label style="display:block;font-size:11px;font-weight:700;color:#64748B;margin-bottom:3px">Дата для выгрузки</label><input type="date" id="inspDate" value="' + esc(to) + '"></div>' +
    '<button class="btn btn-gold" id="btnInspDate">Скачать Excel за дату</button><button class="btn btn-dark" id="btnInspPeriod">Скачать Excel за период</button><button class="btn" id="btnInspReload">Обновить</button></div>' +
    '<div class="scroll"><table><tr><th>Дата</th><th>Время</th><th>Станок</th><th>Оператор</th><th class="r">Пунктов</th><th class="r">Неисправн.</th><th class="r">Замечаний</th></tr>';
  if (!list.length) h += '<tr><td colspan="7" style="color:#64748B">За период осмотров нет</td></tr>';
  list.forEach(x => {
    h += '<tr class="click' + (x.defects ? " miss" : "") + '" data-rid="' + esc(x.recordId) + '"><td>' + atDate(x.at) + "</td><td>" + atTime(x.at) + "</td><td><b>" + esc(x.equipmentId) + "</b></td><td>" + esc(x.empName) + '</td><td class="r">' + fmt(x.totalItems) + '</td><td class="r">' + (x.defects ? '<span class="tag r">' + fmt(x.defects) + "</span>" : "0") + '</td><td class="r">' + fmt(x.comments) + "</td></tr>";
    if (inspOpen === x.recordId) {
      const full = inspFull[x.recordId];
      h += '<tr class="detail"><td colspan="7">' + (!full ? '<div class="note">Загрузка осмотра...</div>' : renderInspItems(full)) + "</td></tr>";
    }
  });
  h += "</table></div></div>";
  $("v-insp").innerHTML = h;
  $("v-insp").querySelectorAll("tr.click").forEach(tr => tr.onclick = () => openInsp(tr.dataset.rid));
  $("btnInspReload").onclick = () => { INSP = null; renderInsp(); };
  $("btnInspDate").onclick = () => exportInsp($("inspDate").value, $("inspDate").value, rig, $("btnInspDate"));
  $("btnInspPeriod").onclick = () => exportInsp(from, to, rig, $("btnInspPeriod"));
}
function renderInspItems(rec) {
  const secs = {}, order = [];
  rec.items.forEach(i => { const k = i.section || "Без раздела"; if (!secs[k]) { secs[k] = []; order.push(k); } secs[k].push(i); });
  return '<div class="note"><b>' + esc(rec.equipmentId) + "</b>, " + esc(rec.empName) + (rec.empId ? " (" + esc(rec.empId) + ")" : "") + ", " + atDate(rec.at) + " " + atTime(rec.at) + ", пунктов: " + rec.items.length + "</div>" +
    order.map(k => '<div style="margin:8px 0 2px;font-weight:800">' + esc(k) + "</div>" + secs[k].map(i => '<div style="padding:2px 0;font-size:13px">' + (i.status === "ok" ? '<span class="tag g">Исправно</span> ' : i.status === "defect" ? '<span class="tag r">Неисправно</span> ' : '<span class="tag">' + esc(chkRu(i.status)) + "</span> ") + esc(i.itemText) + (i.comment ? ' <i style="color:#B45309">— ' + esc(i.comment) + "</i>" : "") + "</div>").join("")).join("");
}
async function openInsp(id) {
  if (inspOpen === id) { inspOpen = ""; renderInsp(); return; }
  inspOpen = id; renderInsp();
  if (inspFull[id]) return;
  const rec = (INSP || []).find(x => x.recordId === id); if (!rec) return;
  try { const r = await fetchInsp(rec.at.slice(0, 10), rec.at.slice(0, 10), rec.equipmentId, false, id); inspFull[id] = r[0] || rec; }
  catch (e) { inspFull[id] = Object.assign({}, rec, { items: [{ section: "Ошибка", itemText: "Не удалось загрузить осмотр: " + e.message, status: "", comment: "" }] }); }
  if (inspOpen === id) renderInsp();
}
async function exportInsp(from, to, rig, btn) {
  if (!from || !to || from > to) { msg("Проверьте дату выгрузки", "err"); return; }
  const label = btn.textContent; btn.disabled = true; btn.textContent = "Формирую файл...";
  try {
    const recs = await fetchInsp(from, to, rig, false);
    if (!recs.length) { msg("За " + (from === to ? ddmmyyyy(from) : ddmmyyyy(from) + "–" + ddmmyyyy(to)) + " осмотров буровых нет."); return; }
    recs.sort((a, b) => a.at < b.at ? -1 : a.at > b.at ? 1 : (a.equipmentId < b.equipmentId ? -1 : 1));
    const flat = [["Дата", "Время", "Станок", "Оператор", "Табельный №", "Раздел", "Пункт осмотра", "Статус", "Комментарий"]];
    const sum = [["Дата", "Время", "Станок", "Оператор", "Табельный №", "Пунктов", "Неисправностей", "Замечаний", "ID осмотра"]];
    recs.forEach(r => {
      const d = xlDate(r.at.slice(0, 10)), t = atTime(r.at);
      sum.push([d, t, r.equipmentId, r.empName, r.empId, r.totalItems, r.defects, r.comments, r.recordId]);
      r.items.forEach(i => flat.push([d, t, r.equipmentId, r.empName, r.empId, i.section, i.itemText, chkRu(i.status), i.comment || ""]));
    });
    const wb = XLSX.utils.book_new();
    [["Осмотры", flat, [12, 7, 9, 28, 12, 26, 60, 12, 36]], ["Сводка", sum, [12, 7, 9, 28, 12, 9, 14, 11, 30]]].forEach(([name, aoa, w]) => {
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      for (let i = 1; i < aoa.length; i++) { const c = ws["A" + (i + 1)]; if (c) c.z = "dd.mm.yyyy"; }
      ws["!cols"] = w.map(x => ({ wch: x })); XLSX.utils.book_append_sheet(wb, ws, name);
    });
    XLSX.writeFile(wb, "БВР_осмотры_" + (from === to ? from : from + "_" + to) + (rig ? "_" + rig : "") + ".xlsx");
    msg("Файл сформирован: осмотров " + recs.length + ", строк пунктов " + (flat.length - 1) + ".");
  } catch (e) { msg("Не удалось выгрузить осмотры: " + e.message, "err"); }
  btn.disabled = false; btn.textContent = label;
}

// Полная выгрузка всех смен из системы: смены, скважины, простои, замены (для резервной копии и отчётов)
async function exportAll() {
  const to = todayIso();
  const all = await fetch(CFG.SHEET_URL + "?action=getDrillShifts&from=2024-01-01&to=" + to).then(r => r.json());
  if (!Array.isArray(all)) throw new Error(all && all.error ? all.error : "ответ сервера не распознан");
  const dt = iso => xlDate(iso);
  const sh = [["Дата", "Смена", "Станок", "Оператор", "Табельный №", "Диаметр", "Блоки", "Скв., шт", "Перебур, шт", "Обурено, м", "Перебур, м", "Бурение, мин", "Простой, мин", "Примечание", "Сдана", "Исправлена", "ID смены"]];
  const hs = [["Дата", "Смена", "Станок", "Оператор", "№ скважины", "Метраж, м", "Время, мин", "Перебур", "Вместо скважины №", "Блок", "Примечание"]];
  const ds = [["Дата", "Смена", "Станок", "Оператор", "Причина", "Минут", "С", "До", "Комментарий"]];
  const rp = [["Дата", "Смена", "Станок", "Оператор", "Инструмент", "Модель / номер", "На скважине №"]];
  all.forEach(s => {
    const d = dt(s.date), sm = Number(s.smena);
    sh.push([d, sm, s.equipmentId, s.empName, s.empId, s.diameter, s.blocks, num(s.holesCount), num(s.redrillCount), num(s.metersDrilled), num(s.metersRedrill), num(s.drillMinutes), num(s.downtimeMinutes), s.note || "", s.createdAt || "", s.updatedAt || "", s.shiftId]);
    (s.holes || []).forEach(h => hs.push([d, sm, s.equipmentId, s.empName, h.n, num(h.depth), num(h.minutes), h.redrill ? "да" : "", h.replacesHole || "", h.block || "", h.note || ""]));
    (s.downtimes || []).forEach(x => ds.push([d, sm, s.equipmentId, s.empName, x.reason, num(x.minutes), x.from || "", x.to || "", x.note || ""]));
    (s.replacements || []).forEach(x => rp.push([d, sm, s.equipmentId, s.empName, TOOLS[x.tool] || x.tool, x.model || "", x.atHole || ""]));
  });
  const wb = XLSX.utils.book_new();
  [["Смены", sh], ["Скважины", hs], ["Простои", ds], ["Замены", rp]].forEach(([name, aoa]) => {
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    for (let i = 1; i < aoa.length; i++) { const c = ws["A" + (i + 1)]; if (c) c.z = "dd.mm.yyyy"; }
    XLSX.utils.book_append_sheet(wb, ws, name);
  });
  XLSX.writeFile(wb, "БВР_все_смены_" + to + ".xlsx");
  msg("Файл сформирован: смен " + (sh.length - 1) + ", скважин " + (hs.length - 1) + ", простоев " + (ds.length - 1) + ", замен " + (rp.length - 1) + ".");
}

function copyText(text, okMsg) {
  const done = () => msg(okMsg);
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done)); }
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { msg("Не удалось скопировать. Используйте «Скачать Excel».", "err"); }
  document.body.removeChild(ta);
}

// Чтение счётчиков из журнала мастера: на листе станка (701, 702, ...) берём последнее числовое значение
// в колонках проходки (M, O, Q, S, U) и последнюю дату, где есть метры (H или I).
function readJournal(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const wb = XLSX.read(new Uint8Array(fr.result), { type: "array", cellDates: true });
      const found = [], jr = [], jrep = [];
      const nn = v => (typeof v === "number" && isFinite(v)) ? v : 0;
      RIGS.forEach(rig => {
        const ws = wb.Sheets[rigNo(rig)]; if (!ws) return;
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
        const seed = { asOf: "" };
        TOOL_KEYS.forEach(k => { let v = null; rows.forEach(r => { const c = r[TOOL_COLS[k][1]]; if (typeof c === "number" && isFinite(c)) v = c; }); if (v != null) seed[k] = r2(v); });
        rows.forEach(r => { const d = r[0]; if (d instanceof Date && ((typeof r[hasSwap(rig) ? 6 : 7] === "number" && r[hasSwap(rig) ? 6 : 7] > 0) || (typeof r[8] === "number" && r[8] > 0))) { seed.asOf = new Date(d.getTime() + 12 * 3600 * 1000).toISOString().slice(0, 10); } });
        rows.forEach(r => {
          const d0 = r[0];
          if (d0 instanceof Date) TOOL_KEYS.forEach(k => {
            const m = r[TOOL_COLS[k][0]];
            if (m != null && String(m).trim() !== "") jrep.push({ rig: rig, tool: k, date: new Date(d0.getTime() + 12 * 3600 * 1000).toISOString().slice(0, 10), smena: Number(r[1]) || 0, model: String(m).trim(), counter: nn(r[TOOL_COLS[k][1]]) });
          });
        });
        rows.forEach(r => {
          const d = r[0], sm = Number(r[1]);
          if (!(d instanceof Date) || (sm !== 1 && sm !== 2)) return;
          const sw = hasSwap(rig), f = nn(r[5]), g = nn(r[sw ? 7 : 6]), h = nn(r[sw ? 6 : 7]), i = nn(r[8]), j = nn(r[9]);
          if (!(h > 0 || i > 0 || j > 0)) return;
          jr.push({ rig: rig, date: new Date(d.getTime() + 12 * 3600 * 1000).toISOString().slice(0, 10), smena: sm, op: String(r[2] == null ? "" : r[2]).trim(), block: String(r[3] == null ? "" : r[3]).trim(), diam: r[4] == null ? "" : r[4], f: f, g: g, h: h, i: i, j: j });
        });
        SEEDS[rig] = seed; found.push(rig + " (по " + (seed.asOf ? ddmmyyyy(seed.asOf) : "дата не найдена") + ")");
      });
      saveSeeds();
      if (found.length) { JROWS = jr; JREPL = jrep; saveJrows(); }
      msg(found.length ? "Из журнала загружено смен: " + jr.length + ", замен инструмента: " + jrep.length + " (" + found.join(", ") + "). Смены видны во вкладках «Сводка» и «Смены», замены во вкладке «Инструмент» (с пометкой «журнал»); счётчики проходки взяты по последним значениям." : "В файле не найдены листы станков (701, 702, ...).");
      renderJournal();
    } catch (e) { msg("Не удалось прочитать файл журнала: " + e.message, "err"); }
  };
  fr.readAsArrayBuffer(file);
}

function exportXlsx(rigs) {
  const from = $("fFrom").value, to = $("fTo").value;
  const wb = XLSX.utils.book_new(); let allRem = [];
  rigs.forEach(r => {
    const J = buildJournal(r, SHIFTS, from, to, SEEDS[r]);
    const aoa = [headFor(r)].concat(J.rows.map(x => cellsFor(r, x.cells).map((v, i) => i === 0 ? xlDate(x.date) : v)));
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    for (let i = 1; i < aoa.length; i++) { const c = ws["A" + (i + 1)]; if (c) c.z = "dd.mm.yyyy"; }
    ws["!cols"] = JOURNAL_HEAD.map((h, i) => ({ wch: i === 2 || i === 3 ? 18 : 13 }));
    XLSX.utils.book_append_sheet(wb, ws, rigNo(r)); allRem = allRem.concat(J.removals);
  });
  const remAoa = [["Дата", "Смена", "Станок", "Инструмент", "Наработка снятого, м", "Поставлен (модель)", "Диаметр"]].concat(allRem.map(x => [xlDate(x.date), x.smena, x.rig, TOOLS[x.tool], x.life, x.newModel, x.diameter]));
  const wr = XLSX.utils.aoa_to_sheet(remAoa); for (let i = 1; i < remAoa.length; i++) { const c = wr["A" + (i + 1)]; if (c) c.z = "dd.mm.yyyy"; }
  XLSX.utils.book_append_sheet(wb, wr, "Замены");
  const dtAoa = [["Дата", "Смена", "Станок", "Оператор", "Причина", "Минут", "С", "До", "Комментарий"]];
  SHIFTS.filter(s => rigs.indexOf(s.equipmentId) >= 0).forEach(s => (s.downtimes || []).forEach(d => dtAoa.push([xlDate(s.date), s.smena, s.equipmentId, s.empName, d.reason, num(d.minutes), d.from || "", d.to || "", d.note || ""])));
  const wd = XLSX.utils.aoa_to_sheet(dtAoa); for (let i = 1; i < dtAoa.length; i++) { const c = wd["A" + (i + 1)]; if (c) c.z = "dd.mm.yyyy"; }
  XLSX.utils.book_append_sheet(wb, wd, "Простои");
  XLSX.writeFile(wb, "БВР_журнал_" + from + "_" + to + ".xlsx");
  msg("Файл сформирован: листы станков, «Замены», «Простои».");
}
